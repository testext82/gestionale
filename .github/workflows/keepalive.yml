name: Supabase keep-alive

on:
  schedule:
    # Due ping al giorno (06:00 e 18:00 UTC). GitHub a volte ritarda i cron di ore:
    # con due esecuzioni giornaliere non ci si avvicina mai alla soglia dei 7 giorni.
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: {}   # avvio manuale con "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query reale su Supabase (conta come attività)
        run: |
          echo "Ping Supabase $(date -u)"
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://vmmkjmljsliuczskrlfi.supabase.co/rest/v1/records?select=collection&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtbWtqbWxqc2xpdWN6c2tybGZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTY1NzYsImV4cCI6MjEwMTA3MjU3Nn0.eD96Hcd4cInU3jwnuoGASGUC4-It2ZhT4fDJ9aP5708" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtbWtqbWxqc2xpdWN6c2tybGZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTY1NzYsImV4cCI6MjEwMTA3MjU3Nn0.eD96Hcd4cInU3jwnuoGASGUC4-It2ZhT4fDJ9aP5708")
          echo "Risposta HTTP: $code"
          # 200 = query andata a buon fine (attività reale sul database)
          if [ "$code" != "200" ]; then echo "Attenzione: atteso 200, ricevuto $code"; fi
