function ddtTacAuto(){const sel=document.getElementById('d-tac-sel');if(sel){sel.dataset.touched='';if(sel.dataset.auto)sel.value=sel.dataset.auto;ddtTacHint();}}
function collectDDTLines(){
  return [...document.querySelectorAll('#ddt-lines-body tr')].map(tr=>{
    const mid=tr.querySelector('.l-mat').value||null;const m=matById(mid);
    const przRaw=tr.querySelector('.l-prz').value;
    const prezzoUnitario=(przRaw!==''&&przRaw!=null)?numIt(przRaw):(mid?prezzoMateriale(mid,ddtCtx()):0);
    return {materialeId:mid,
      descrizione:tr.querySelector('.l-desc').value.trim()||(m?m.descrizione:''),
      aspetto:m?m.aspetto:'',
      um:tr.querySelector('.l-um').value.trim()||(m?m.um:''),
      quantita:num(tr.querySelector('.l-qta').value),
      prezzoUnitario,
      aliquotaIva:(m&&m.aliquotaIva!=null)?m.aliquotaIva:22};
  }).filter(r=>r.descrizione||r.quantita);
}
/* Se il prezzo di una riga (con materiale) è diverso da quello risolto,
   lo salva nel listino del cliente: aggiorna la voce o crea il listino se assente. */
function ddtSavePricesToListino(clienteId,righe){
  if(!clienteId)return;
  const destinazioneId=(document.getElementById('d-dest-sel')||{}).value||null;
  const contrattoId=(document.getElementById('d-contratto')||{}).value||null;
  let listino=null;let creato=false,aggiornati=0;
  righe.forEach(r=>{
    if(!r.materialeId||!(r.prezzoUnitario>0))return;
    const ctx={clienteId,destinazioneId,contrattoId};
    const esiste=prezzoUMEsiste(r.materialeId,r.um,ctx);
    const resolved=prezzoMateriale(r.materialeId,ctx,r.um);
    if(esiste&&round2(r.prezzoUnitario)===round2(resolved))return; // già a listino e invariato
    if(!listino){
      listino=S.listini.find(l=>l.tipo==='cliente'&&l.clienteId===clienteId&&!l.destinazioneId);
      if(!listino){listino={id:uid(),nome:'Listino '+clienteName(clienteId),tipo:'cliente',clienteId,destinazioneId:'',voci:[]};S.listini.push(listino);creato=true;}
    }
    listino.voci=listino.voci||[];
    const v=listino.voci.find(v=>v.materialeId===r.materialeId&&(v.um||'')===(r.um||''));
    if(v)v.prezzo=r.prezzoUnitario;else listino.voci.push({materialeId:r.materialeId,um:r.um||'',prezzo:r.prezzoUnitario});
    aggiornati++;
  });
  if(aggiornati)toast(creato?'Creato listino cliente con i nuovi prezzi':'Prezzi aggiornati nel listino del cliente');
}
function ddtStatoFattOf(d){ if(d&&d.statoFatt)return d.statoFatt; if(d&&d.causale&&d.causale!=='Vendita')return 'definire'; return 'fatturare'; }
function ddtSyncStato(){ const cs=document.getElementById('d-causale'),ss=document.getElementById('d-statofatt'); if(!cs||!ss)return; ss.value=(cs.value==='Vendita')?'fatturare':'definire'; }
function ddtStatoBadge(d){
  if(d.fatturato)return '<span class="pill grey">Fatturato</span>';
  const s=ddtStatoFattOf(d);
  if(s==='definire')return '<span class="pill accent">Da definire</span>';
  if(s==='nonfatturare')return '<span class="pill grey">Da non fatturare</span>';
  return '<span class="pill warn">Da fatturare</span>';
}
function ddtBillable(d){ return !d.fatturato && ddtStatoFattOf(d)!=='nonfatturare'; }
function ddtSetStato(id,val){const d=S.ddt.find(x=>x.id===id);if(!d)return;d.statoFatt=val;logAction('DDT stato fatturazione',(d.numero||'')+'/'+(d.anno||'')+' → '+val);persist();render();}
function saveDDT(id,anno){
  const clienteId=document.getElementById('d-cliente').value;
  if(!clienteId){toast('Seleziona il committente (cliente)');return false;}
  const mezzoId=document.getElementById('d-mezzo').value;
  if(!mezzoId){toast('Seleziona il mezzo di trasporto');return false;}
  const righe=collectDDTLines();
  if(righe.length===0){toast('Aggiungi almeno una riga di beni');return false;}
  const lordoChk=num(document.getElementById('d-lordo').value),taraChk=num(document.getElementById('d-tara').value);
  if(lordoChk>0&&taraChk>0&&lordoChk<taraChk){toast('Il lordo non può essere inferiore alla tara');return false;}
  ddtSavePricesToListino(clienteId,righe);
  const tara=num(document.getElementById('d-tara').value);
  // salva tara sul mezzo se diversa
  const mezzo=S.mezzi.find(x=>x.id===mezzoId);
  if(mezzo&&tara&&num(mezzo.taraKg)!==tara){ mezzo.taraKg=tara; mezzo.taraUltimoAgg=nowLocal(); }
  const trTipo=document.getElementById('d-tr-tipo').value;
  const trasporto=trTipo?{tipo:trTipo,prezzo:num(document.getElementById('d-tr-prezzo').value),
      um:trTipo==='misura'?document.getElementById('d-tr-um').value:'',
      quantita:trTipo==='misura'?num(document.getElementById('d-tr-qta').value):1}:null;
  const data={
    id:id||uid(),
    numero:parseInt(document.getElementById('d-num').value)||nextNumber('ddt',yearOf(document.getElementById('d-data').value)).numero,
    anno:yearOf(document.getElementById('d-data').value),
    data:document.getElementById('d-data').value||today(),
    clienteId,
    contrattoId:document.getElementById('d-contratto').value||null,
    committente:document.getElementById('d-committente').value.trim(),
    caricatore:{tipo:document.getElementById('d-car-tipo').value,testo:document.getElementById('d-car-testo').value.trim()},
    proprietarioMerce:{tipo:document.getElementById('d-prop-tipo').value,testo:document.getElementById('d-prop-testo').value.trim()},
    destinazioneId:document.getElementById('d-dest-sel').value||null,
    destinazione:document.getElementById('d-dest').value.trim(),
    causale:document.getElementById('d-causale').value.trim(),
    trasportoACura:document.getElementById('d-tac-sel').value||'cedente',
    mezzoId,
    compilatoreId:document.getElementById('d-comp').value||null,
    righe,
    lordoKg:num(document.getElementById('d-lordo').value),
    taraKg:tara,
    nettoKg:num(document.getElementById('d-netto').value),
    dataOraInizio:document.getElementById('d-inizio').value,
    trasporto,
    resa:document.getElementById('d-resa').value.trim(),
    aspettoBeni:document.getElementById('d-aspetto').value.trim(),
    annotazioni:document.getElementById('d-note').value.trim(),
    fatturato:id?(S.ddt.find(x=>x.id===id).fatturato||false):false,
    statoFatt:(document.getElementById('d-statofatt')||{}).value||'definire',
  };
  if(id){const i=S.ddt.findIndex(x=>x.id===id);S.ddt[i]=data;}
  else S.ddt.push(data);
  commitNumber('ddt',data.anno,data.numero);
  logAction(id?'DDT modificato':'DDT creato','DDT '+data.numero+'/'+data.anno+' · '+(clienteName(data.clienteId)||''));
  persist();render();toast('DDT '+data.numero+'/'+data.anno+' salvato');return true;
}

const SCAD_CATEGORIE_DEF=['Assicurazione','Bollo mezzo','Pagamento','Tasse / Imposte','Contributi','Canone / Affitto','Utenze','Revisione / Collaudo','Altro'];
const SCAD_RICORRENZE={nessuna:'Nessuna (una tantum)',mensile:'Mensile',trimestrale:'Trimestrale',semestrale:'Semestrale',annuale:'Annuale'};
function scadStato(x){
  if(x.evasa)return {ord:9,cls:'grey',lab:'Evasa'};
  if(!x.dataScadenza)return {ord:5,cls:'grey',lab:'Senza data'};
  const gg=Math.round((new Date(x.dataScadenza)-new Date(today()))/86400000);
  if(gg<0)return {ord:0,cls:'danger',lab:'Scaduta da '+Math.abs(gg)+' gg'};
  if(gg<=30)return {ord:1,cls:'warn',lab:gg===0?'Scade oggi':'Tra '+gg+' gg'};
  return {ord:2,cls:'ok',lab:'Tra '+gg+' gg'};
}
function scadProssima(dateStr,ric){
  const d=new Date(dateStr);if(isNaN(d))return dateStr;
  const add={mensile:[0,1],trimestrale:[0,3],semestrale:[0,6],annuale:[1,0]}[ric];
  if(!add)return dateStr;
  d.setFullYear(d.getFullYear()+add[0]);d.setMonth(d.getMonth()+add[1]);
  return d.toISOString().slice(0,10);
}
function scadEvadi(id){
  const x=S.scadenze.find(s=>s.id===id);if(!x)return;
  if(x.ricorrenza&&x.ricorrenza!=='nessuna'){
    const nuova=scadProssima(x.dataScadenza,x.ricorrenza);x.dataScadenza=nuova;x.evasa=false;
    persist();render();toast('Registrata · prossima scadenza '+dmy(nuova));
  }else{x.evasa=!x.evasa;persist();render();toast(x.evasa?'Segnata come evasa':'Riaperta');}
}

/* Conta le pagine A4 effettivamente occupate dal contratto reso a video */
function raCalcPagine(id){
  const d=document.querySelector('#doc-canvas .doc.ra'),el=document.getElementById('ra-pagine-val');
  if(!d||!el)return;
  const rec=S.contrattiRA.find(s=>s.id===id);
  if(rec&&String(rec.pagine||'').trim()){el.textContent=rec.pagine;return;} // valore forzato a mano
  const w=d.clientWidth||1;
  const hPagina=w*273/186;            // area utile A4: 186 × 273 mm (margini 12 mm)
  const n=Math.max(1,Math.ceil((d.scrollHeight-4)/hPagina));
  el.textContent=n;
  if(rec&&rec.pagineCalc!==n){rec.pagineCalc=n;persist();}
}

const filtriConf={dal:'',al:'',eer:''};
function confFiltra(){ let rows=[...S.conferimenti];
  if(filtriConf.dal)rows=rows.filter(x=>(x.data||'')>=filtriConf.dal);
  if(filtriConf.al)rows=rows.filter(x=>(x.data||'')<=filtriConf.al);
  if(filtriConf.eer)rows=rows.filter(x=>(x.eer||'')===filtriConf.eer);
  const t=(searchTerm.conferimenti||'').toLowerCase().trim();
  if(t)rows=rows.filter(x=>[x.produttore,x.eer,x.descrizione,x.cantiere].filter(Boolean).join(' ').toLowerCase().includes(t));
  return rows.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
}

/* ===================== FATTURE ELETTRONICHE (import XML/ZIP, sola lettura) ===================== */
const FE_TIPODOC={TD01:'Fattura',TD02:'Acconto/anticipo',TD03:'Acconto su parcella',TD04:'Nota di credito',TD05:'Nota di debito',TD06:'Parcella',TD16:'Autofattura interna',TD17:'Autofattura acquisto estero',TD18:'Acquisto intracomunitario',TD19:'Acquisto ex art.17',TD24:'Fattura differita',TD25:'Fattura differita',TD26:'Cessione beni ammortizzabili',TD27:'Autoconsumo'};
const FE_MP={MP01:'Contanti',MP02:'Assegno',MP03:'Assegno circolare',MP05:'Bonifico',MP08:'Carta di pagamento',MP12:'RIBA',MP19:'SEPA Direct Debit'};
const filtriFE={anno:'',tipo:'',pagata:'',dal:'',al:''};
let feSel=new Set();
function feLocal(el){return el.localName||el.tagName.replace(/^.*:/,'');}
function feMiaPiva(){return String((S.azienda&&S.azienda.partitaIva)||'01983311000').replace(/\D/g,'');}
function feExtractXml(text){
  let start=text.search(/<([A-Za-z0-9]+:)?FatturaElettronica[ >]/);
  if(start<0){const i=text.indexOf('<?xml');if(i>=0)start=i;}
  if(start<0)return null;
  const m=text.match(/<\/([A-Za-z0-9]+:)?FatturaElettronica>/);
  if(!m)return null;
  const end=text.lastIndexOf(m[0])+m[0].length;
  return text.slice(start,end);
}
function feParse(xml,fileName){
  let doc;try{doc=new DOMParser().parseFromString(xml,'application/xml');}catch(e){return null;}
  if(!doc||doc.getElementsByTagName('parsererror').length)return null;
  const root=doc.documentElement;if(!root)return null;
  const all=(scope)=>[...(scope||root).getElementsByTagName('*')];
  const find=(n,scope)=>all(scope).find(x=>feLocal(x)===n)||null;
  const txt=(n,scope)=>{const e=find(n,scope);return e?e.textContent.trim():'';};
  const findAll=(n,scope)=>all(scope).filter(x=>feLocal(x)===n);
  const cedente=find('CedentePrestatore'),cess=find('CessionarioCommittente');
  if(!cedente&&!cess)return null;
  const nomeDi=el=>txt('Denominazione',el)||((txt('Nome',el)+' '+txt('Cognome',el)).trim());
  const cedPiva=txt('IdCodice',find('IdFiscaleIVA',cedente));
  const cessIva=find('IdFiscaleIVA',cess);const cessPiva=cessIva?txt('IdCodice',cessIva):txt('CodiceFiscale',cess);
  const dg=find('DatiGeneraliDocumento');
  const numero=txt('Numero',dg),data=txt('Data',dg),tipoDoc=txt('TipoDocumento',dg);
  const totDoc=num(txt('ImportoTotaleDocumento',dg));
  const riep=findAll('DatiRiepilogo').map(r=>({aliquota:num(txt('AliquotaIVA',r)),imponibile:num(txt('ImponibileImporto',r)),imposta:num(txt('Imposta',r)),natura:txt('Natura',r),norma:txt('RiferimentoNormativo',r)}));
  const imponibile=riep.reduce((s,r)=>s+r.imponibile,0);
  const imposta=riep.reduce((s,r)=>s+r.imposta,0);
  const pagamenti=findAll('DettaglioPagamento').map(p=>({scadenza:txt('DataScadenzaPagamento',p),importo:num(txt('ImportoPagamento',p)),modalita:txt('ModalitaPagamento',p)}));
  const descr=findAll('DettaglioLinee').map(l=>({descrizione:txt('Descrizione',l),quantita:txt('Quantita',l),um:txt('UnitaMisura',l),prezzo:num(txt('PrezzoTotale',l))}));
  const mia=feMiaPiva(),cedD=(cedPiva||'').replace(/\D/g,'');
  const attiva=cedD===mia;
  return {id:uid(),chiave:(attiva?'A':'P')+'|'+cedD+'|'+(cessPiva||'').replace(/\D/g,'')+'|'+numero+'|'+data,
    fileName:fileName||'',tipo:attiva?'attiva':'passiva',numero,data,tipoDoc,
    controparteNome:attiva?nomeDi(cess):nomeDi(cedente),contropartePiva:attiva?cessPiva:cedPiva,
    imponibile:round2(imponibile),imposta:round2(imposta),totale:round2(totDoc||imponibile+imposta),
    aliquote:riep,pagamenti,righe:descr,pagata:false,dataPag:''};
}
async function feImport(input){
  const files=[...input.files];input.value='';
  let added=0,skip=0,err=0;
  const consuma=(text,fname)=>{const rec=feParse(text,fname);if(!rec){err++;return;}if(S.fattureEl.some(x=>x.chiave===rec.chiave)){skip++;return;}S.fattureEl.push(rec);added++;};
  for(const f of files){
    const nl=f.name.toLowerCase();
    if(nl.includes('metaen')||nl.includes('_mt_')){skip++;continue;}
    try{
      if(nl.endsWith('.zip')){
        if(!window.JSZip){toast('Componente ZIP non ancora pronto: riprova tra un istante');continue;}
        const zip=await JSZip.loadAsync(await f.arrayBuffer());
        for(const path of Object.keys(zip.files)){
          const e=zip.files[path];if(e.dir)continue;const pl=path.toLowerCase();
          if(pl.includes('metaen')||pl.includes('_mt_'))continue;
          if(pl.endsWith('.p7m')){const x=feExtractXml(new TextDecoder('latin1').decode(await e.async('uint8array')));if(x)consuma(x,path.split('/').pop());else err++;}
          else if(pl.endsWith('.xml')){consuma(await e.async('string'),path.split('/').pop());}
        }
      } else if(nl.endsWith('.p7m')){
        const x=feExtractXml(new TextDecoder('latin1').decode(new Uint8Array(await f.arrayBuffer())));
        if(x)consuma(x,f.name);else{err++;}
      } else if(nl.endsWith('.xml')){ consuma(await f.text(),f.name); }
    }catch(e){console.error(e);err++;}
  }
  if(added)logAction('Fatture elettroniche importate',added+' fatture');
  persist();render();
  toast(`Importate ${added} fatture`+(skip?` · ${skip} già presenti/ignorate`:'')+(err?` · ${err} non lette`:''));
}
function feFiltra(){
  let rows=[...S.fattureEl];
  if(filtriFE.anno)rows=rows.filter(f=>String(f.data||'').slice(0,4)===filtriFE.anno);
  if(filtriFE.tipo)rows=rows.filter(f=>f.tipo===filtriFE.tipo);
  if(filtriFE.pagata==='si')rows=rows.filter(f=>f.pagata);
  if(filtriFE.pagata==='no')rows=rows.filter(f=>!f.pagata);
  if(filtriFE.dal)rows=rows.filter(f=>(f.data||'')>=filtriFE.dal);
  if(filtriFE.al)rows=rows.filter(f=>(f.data||'')<=filtriFE.al);
  const t=(searchTerm.fattureEl||'').toLowerCase().trim();
  if(t)rows=rows.filter(f=>[f.numero,f.controparteNome,f.contropartePiva].filter(Boolean).join(' ').toLowerCase().includes(t));
  return rows.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
}
function feAnni(){const s=new Set(S.fattureEl.map(f=>String(f.data||'').slice(0,4)).filter(Boolean));s.add(String(new Date().getFullYear()));return [...s].sort().reverse();}
function renderFattureEl(c){
  setActions(`<label class="btn primary" style="cursor:pointer">${svg(IC.plus)} Importa XML / ZIP
      <input type="file" multiple accept=".xml,.zip,.p7m" style="display:none" onchange="feImport(this)"></label>
    ${S.fattureEl.length?`<button class="btn" onclick="stampaRegistroFE()">${svg(IC.print)} Registro</button>`:''}`);
  const rows=feFiltra();
  const att=rows.filter(f=>f.tipo==='attiva'),pas=rows.filter(f=>f.tipo==='passiva');
  const sum=a=>a.reduce((s,f)=>s+num(f.totale),0);
  const impSum=a=>a.reduce((s,f)=>s+num(f.imponibile),0), ivaSum=a=>a.reduce((s,f)=>s+num(f.imposta),0);
  const attTot=sum(att),pasTot=sum(pas),attImp=impSum(att),pasImp=impSum(pas),attIva=ivaSum(att),pasIva=ivaSum(pas);
  const kpi=(icona,titolo,a,p)=>`<div class="stat"><div class="k">${icona} ${titolo}</div>
    <div style="display:flex;flex-direction:column;gap:1px;margin-top:4px">
      <span class="sub" style="color:var(--ok)">Attive € ${eur(a)}</span>
      <span class="sub" style="color:var(--danger)">Passive € ${eur(p)}</span>
      <span class="strong">Saldo € ${eur(a-p)}</span>

  // riepilogo IVA per aliquota

function feToggleStato(id){
  const f=S.fattureEl.find(x=>x.id===id);if(!f)return;
  f.pagata=!f.pagata;f.dataPag=f.pagata?today():'';persist();render();
  if(f.pagata){
    if(S.primaNota.some(m=>m.fatturaElId===f.id)){toast(f.tipo==='attiva'?'Segnata come incassata':'Segnata come pagata');return;}
    const entrata=f.tipo==='attiva';
    const body=`<div class="note">${svg(IC.card)}<div>Registrare ${entrata?'l&rsquo;incasso':'il pagamento'} di <b>€ ${eur(f.totale)}</b> (fattura ${esc(f.numero||'')} — ${esc(f.controparteNome||'')}) in Prima Nota?</div></div>
      <div class="form-grid"><div class="field col2"><label>Su quale conto</label><select id="fe-conto">${PN_CONTI.map(x=>`<option ${x==='Banca'?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div>`;
    openModal('Registra in Prima Nota',body,()=>{
      S.primaNota.push({id:uid(),data:f.dataPag||today(),tipo:entrata?'entrata':'uscita',conto:document.getElementById('fe-conto').value||'Banca',
        categoria:entrata?'Incasso fattura':'Acquisti / Forniture',importo:num(f.totale),
        descrizione:`Fattura ${f.numero||''} — ${f.controparteNome||''}`,fatturaElId:f.id,note:''});
      persist();render();toast('Registrato in Prima Nota');return true;
    },{submitLabel:'Registra in Prima Nota'});
  } else if(S.primaNota.some(m=>m.fatturaElId===f.id)){
    confirmDialog('Rimuovere il movimento in Prima Nota?','Vuoi rimuovere anche il movimento collegato a questa fattura?',()=>{S.primaNota=S.primaNota.filter(m=>m.fatturaElId!==f.id);persist();render();toast('Movimento rimosso');});
  }
}
function feToggleSel(id,ck){if(ck)feSel.add(id);else feSel.delete(id);render();}
function feSelAll(ck){const rows=feFiltra();if(ck)rows.forEach(f=>feSel.add(f.id));else rows.forEach(f=>feSel.delete(f.id));render();}
function feClearSel(){feSel.clear();render();}
function feStampaSelezionate(){const rows=S.fattureEl.filter(f=>feSel.has(f.id));if(!rows.length){toast('Nessuna fattura selezionata');return;}stampaRegistroFE(rows);}
function feDeleteSelezionate(){
  const ids=[...feSel];if(!ids.length)return;

    S.fattureEl=S.fattureEl.filter(x=>!feSel.has(x.id));feSel.clear();persist();render();toast(ids.length+' fatture rimosse');});
}
function feDelete(id){confirmDialog('Rimuovere questa fattura importata?','Elimina solo la copia importata nel gestionale, non il file originale.',()=>{S.fattureEl=S.fattureEl.filter(x=>x.id!==id);feSel.delete(id);persist();render();toast('Fattura rimossa');});}
function stampaRegistroFE(rowsArg){
  const rows=(rowsArg||feFiltra()).slice().sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const sotto=[filtriFE.anno&&('Anno '+filtriFE.anno),filtriFE.tipo&&(filtriFE.tipo==='attiva'?'Attive':'Passive')].filter(Boolean).join(' · ')||'Attive e passive';
  const tImp=rows.reduce((s,f)=>s+num(f.imponibile),0),tIva=rows.reduce((s,f)=>s+num(f.imposta),0),tTot=rows.reduce((s,f)=>s+num(f.totale),0);

    <table class="goods"><thead><tr><th>Data</th><th>Numero</th><th>Tipo</th><th style="text-align:left">Controparte</th><th>Imponibile</th><th>IVA</th><th>Totale</th></tr></thead>
    <tbody>${rows.length?rows.map(f=>`<tr><td>${f.data?dmy(f.data):''}</td><td>${esc(f.numero||'')}</td><td>${f.tipo==='attiva'?'Att.':'Pass.'}</td><td style="text-align:left">${esc(f.controparteNome||'')}</td><td class="n">€ ${eur(f.imponibile)}</td><td class="n">€ ${eur(f.imposta)}</td><td class="n">€ ${eur(f.totale)}</td></tr>`).join(''):'<tr><td colspan="7">Nessuna fattura.</td></tr>'}
    <tr><td colspan="4" style="text-align:right"><b>Totali</b></td><td class="n"><b>€ ${eur(tImp)}</b></td><td class="n"><b>€ ${eur(tIva)}</b></td><td class="n"><b>€ ${eur(tTot)}</b></td></tr></tbody></table></div>`;
  const reg={titolo:'FATTURE ELETTRONICHE',sotto,cols:[{title:'Data',w:20},{title:'Numero',w:24},{title:'Tipo',w:14},{title:'Controparte',w:60},{title:'Imponibile',w:24,align:'right'},{title:'IVA',w:20,align:'right'},{title:'Totale',w:24,align:'right'}],
    rows:rows.map(f=>[f.data?dmy(f.data):'',f.numero||'',f.tipo==='attiva'?'Att.':'Pass.',f.controparteNome||'','€ '+eur(f.imponibile),'€ '+eur(f.imposta),'€ '+eur(f.totale)]),
    tot:`Imponibile € ${eur(tImp)} · IVA € ${eur(tIva)} · Totale € ${eur(tTot)}`};
  openPreview({type:'registro',reg,title:'Fatture elettroniche',filename:'Fatture_elettroniche',email:{to:'',subject:'',body:''}},html);
}

/* ===================== PRIMA NOTA ===================== */
const PN_CONTI=['Cassa','Banca','Altro'];
const PN_CATEGORIE_DEF=['Incasso fattura','Incasso vario','Carburante','Manutenzione mezzi','Stipendi','Tasse / Imposte','Contributi','Assicurazioni','Utenze','Affitto / Canone','Acquisti / Forniture','Spese cava','Banca / Commissioni','Altro'];
const filtriPN={anno:'',conto:'',tipo:'',categoria:''};
function pnSaldi(rows){ const ap=(S.settings&&S.settings.pnApertura)||{};
  const s={Cassa:num(ap.Cassa),Banca:num(ap.Banca),Altro:num(ap.Altro)};
  (rows||S.primaNota).forEach(m=>{ const c=PN_CONTI.includes(m.conto)?m.conto:'Altro'; const v=num(m.importo)*(m.tipo==='uscita'?-1:1); s[c]+=v; }); return s; }
function pnAperturaDialog(){
  const ap=(S.settings&&S.settings.pnApertura)||{};
  const body=`<div class="note">${svg(IC.card)}<div>Imposta il saldo di partenza di ogni conto (es. quanto c&rsquo;era in cassa e in banca all&rsquo;inizio). Verrà sommato ai movimenti per mostrare i saldi reali.</div></div>
    <div class="form-grid">${PN_CONTI.map(c=>`<div class="field"><label>Saldo iniziale ${c} (€)</label><input id="ap-${c}" type="number" step="0.01" value="${ap[c]!=null&&ap[c]!==''?ap[c]:''}"></div>`).join('')}</div>`;
  openModal('Saldi iniziali dei conti',body,()=>{
    S.settings=S.settings||{};
    S.settings.pnApertura={Cassa:num(document.getElementById('ap-Cassa').value),Banca:num(document.getElementById('ap-Banca').value),Altro:num(document.getElementById('ap-Altro').value)};
    persist();render();toast('Saldi iniziali aggiornati');return true;
  },{submitLabel:'Salva saldi iniziali'});
}
function pnFiltra(){ let rows=[...S.primaNota];
  if(filtriPN.anno)rows=rows.filter(m=>String(m.data||'').slice(0,4)===filtriPN.anno);
  if(filtriPN.conto)rows=rows.filter(m=>(m.conto||'Altro')===filtriPN.conto);
  if(filtriPN.tipo)rows=rows.filter(m=>m.tipo===filtriPN.tipo);
  if(filtriPN.categoria)rows=rows.filter(m=>(m.categoria||'')===filtriPN.categoria);
  const term=(searchTerm.primaNota||'').toLowerCase().trim();
  if(term)rows=rows.filter(m=>[m.descrizione,m.categoria,m.conto].filter(Boolean).join(' ').toLowerCase().includes(term));
  return rows;
}
function pnAnni(){ const set=new Set(S.primaNota.map(m=>String(m.data||'').slice(0,4)).filter(Boolean)); set.add(String(new Date().getFullYear())); return [...set].sort().reverse(); }

    </div>
    <div class="toolbar" style="flex-wrap:wrap;gap:8px">
      <div class="search">${svg(IC.search)}<input placeholder="Cerca descrizione, categoria…" value="${esc(searchTerm.primaNota||'')}" data-sf="primaNota" oninput="searchTerm.primaNota=this.value;render()"></div>
      <select onchange="filtriPN.anno=this.value;render()"><option value="">Tutti gli anni</option>${anni.map(a=>opt(a,filtriPN.anno)).join('')}</select>
      <select onchange="filtriPN.conto=this.value;render()"><option value="">Tutti i conti</option>${PN_CONTI.map(x=>opt(x,filtriPN.conto)).join('')}</select>
      <select onchange="filtriPN.tipo=this.value;render()"><option value="">Entrate e uscite</option><option value="entrata" ${filtriPN.tipo==='entrata'?'selected':''}>Solo entrate</option><option value="uscita" ${filtriPN.tipo==='uscita'?'selected':''}>Solo uscite</option></select>

    </div>
    <div class="card">
      ${S.primaNota.length===0
        ? emptyState('card','Nessun movimento','Registra entrate e uscite di cassa e banca. Le fatture incassate possono generare il movimento in automatico.',`<button class="btn primary" onclick="openMovimento()">${svg(IC.plus)} Nuovo movimento</button>`)

        : `<table><thead><tr><th>Data</th><th>Descrizione</th><th>Conto</th><th class="num">Entrate</th><th class="num">Uscite</th><th></th></tr></thead>

            <td class="num strong" style="color:var(--danger)">${m.tipo==='uscita'?'€ '+eur(m.importo):''}</td>
            <td class="actions">
              <button class="icon-btn sm" title="Modifica" onclick="openMovimento('${m.id}')">${svg(IC.edit,1.9)}</button>
              <button class="icon-btn sm danger" title="Elimina" onclick="delMovimento('${m.id}')">${svg(IC.trash,1.9)}</button>
            </td></tr>`).join('')}
          <tr style="border-top:2px solid var(--line)"><td colspan="3" class="strong">Totali del periodo</td>
            <td class="num strong" style="color:var(--ok)">€ ${eur(totE)}</td>
            <td class="num strong" style="color:var(--danger)">€ ${eur(totU)}</td>
            <td class="strong num">${(totE-totU)>=0?'+':''}€ ${eur(totE-totU)}</td></tr>
          </tbody></table>`}
    </div>`;
}
function openMovimento(id){
  const m=id?S.primaNota.find(x=>x.id===id):{id:uid(),data:today(),tipo:'uscita',conto:'Cassa',categoria:'',importo:'',descrizione:'',note:''};
  const catOpts=`<option value="">— scegli —</option>`+S.pnCategorie.map(x=>`<option ${m.categoria===x?'selected':''}>${esc(x)}</option>`).join('')
    +((m.categoria&&!S.pnCategorie.includes(m.categoria))?`<option selected>${esc(m.categoria)}</option>`:'');
  const body=`<div class="form-grid">
    <div class="field"><label>Data</label><input id="mv-data" type="date" value="${m.data||''}"></div>
    <div class="field"><label>Tipo</label><select id="mv-tipo"><option value="entrata" ${m.tipo==='entrata'?'selected':''}>Entrata</option><option value="uscita" ${m.tipo!=='entrata'?'selected':''}>Uscita</option></select></div>

    <div class="field"><label>Importo (€)</label><input id="mv-importo" type="number" step="0.01" value="${m.importo!==''&&m.importo!=null?m.importo:''}"></div>
    <div class="field col2"><label>Categoria</label><div class="with-add"><select id="mv-cat">${catOpts}</select>${qaBtn("pnQuickCat()")}</div></div>
    <div class="field col2"><label>Descrizione</label><input id="mv-desc" value="${esc(m.descrizione||'')}" placeholder="Es. Rifornimento gasolio, incasso fattura 12/2026…"></div>
    <div class="field col2"><label>Note</label><textarea id="mv-note" rows="2">${esc(m.note||'')}</textarea></div>
    ${m.fatturaId?`<div class="field col2"><span class="hint">Movimento collegato a una fattura incassata.</span></div>`:''}
  </div>`;
  openModal(`${id?'Modifica':'Nuovo'} movimento`,body,()=>{
    const v=i=>{const el=document.getElementById(i);return el?el.value.trim():'';};
    const imp=num(v('mv-importo'));

function fatturaToggleIncasso(id){
  const f=S.fatture.find(x=>x.id===id);if(!f)return;
  f.incassata=!f.incassata;f.dataIncasso=f.incassata?today():'';
  persist();render();
  if(f.incassata){
    if(S.primaNota.some(m=>m.fatturaId===f.id)){toast('Fattura incassata');return;}
    const body=`<div class="note">${svg(IC.card)}<div>Registrare l&rsquo;incasso di <b>€ ${eur(f.totale)}</b> (fattura ${f.numero}/${f.anno}) in Prima Nota?</div></div>
      <div class="form-grid"><div class="field col2"><label>Su quale conto</label><select id="inc-conto">${PN_CONTI.map(x=>`<option ${x==='Banca'?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div>`;
    openModal('Registra incasso in Prima Nota',body,()=>{
      const mov=pnDaFattura(f);mov.conto=document.getElementById('inc-conto').value||'Banca';
      S.primaNota.push(mov);persist();render();toast('Incasso registrato in Prima Nota');return true;
    },{submitLabel:'Registra in Prima Nota'});
  }else{
    if(S.primaNota.some(m=>m.fatturaId===f.id))
      confirmDialog('Rimuovere l&rsquo;incasso dalla Prima Nota?','Hai segnato la fattura come da incassare: vuoi rimuovere anche il relativo movimento in Prima Nota?',()=>{S.primaNota=S.primaNota.filter(m=>m.fatturaId!==f.id);persist();render();toast('Movimento rimosso');});
    else toast('Fattura da incassare');
  }
}
function fatturaScadenzaCell(f){
  if(f.incassata)return `<span class="pill ok">${svg(IC.check,1.7)} Incassata</span>${f.dataIncasso?`<div class="sub">${dmy(f.dataIncasso)}</div>`:''}`;
  if(!f.scadenza)return `<span class="sub">—</span>${f.modalitaPagamento?`<div class="sub">${esc(f.modalitaPagamento)}</div>`:''}`;
  const gg=Math.round((new Date(f.scadenza)-new Date(today()))/86400000);
  const cls=gg<0?'danger':(gg<=7?'warn':'grey');
  const lab=gg<0?`Scaduta da ${Math.abs(gg)} gg`:(gg===0?'Scade oggi':`tra ${gg} gg`);
  return `<span class="pill ${cls}">${dmy(f.scadenza)}</span><div class="sub">${lab}${f.modalitaPagamento?' · '+esc(f.modalitaPagamento):''}</div>`;
}
function fatturaContrattiOf(f){return (f.contrattoIds&&f.contrattoIds.length)?f.contrattoIds:(f.contrattoId?[f.contrattoId]:[]);}
function fatturaRifLabel(f){
  const ddt=(f.ddtIds||[]).map(did=>{const dd=S.ddt.find(d=>d.id===did);return dd?'DDT '+dd.numero+'/'+dd.anno:'';}).filter(Boolean);
  if(ddt.length)return ddt.join(', ');

  if(cs.length)return cs.length===1?cs[0]:cs.length+' contratti';
  return f.causaleManuale||'—';
}

/* Struttura righe: con DDT o contratto → Descrizione/U.M./Q.tà/Prezzo/IVA
   senza riferimenti → solo Descrizione/Importo/IVA (fattura libera) */
function fatturaHasRif(){
  const ddt=document.querySelectorAll('.f-ddt:checked').length>0;
  const contr=(fatturaContratti&&fatturaContratti.length>0)||!!(document.getElementById('f-contratto')||{}).value;
  return ddt||contr;
}
function fatturaUpdateMode(){
  const wrap=document.getElementById('f-lines-wrap');if(!wrap)return;
  const libera=!fatturaHasRif();
  wrap.classList.toggle('libera',libera);
  if(libera){
    document.querySelectorAll('#fatt-lines-body tr').forEach(tr=>{
      const q=tr.querySelector('.f-qta');if(num(q.value)!==1)q.value=1;
      const um=tr.querySelector('.f-um');if(um.value)um.value='';
    });
  }
  const c=S.contratti.find(x=>x.id===(document.getElementById('f-contratto')||{}).value);
  const btn=document.getElementById('f-add-contr');
  if(btn)btn.style.display=(c&&contrattoIsCanone(c)&&c.periodicita!=='forfettario')?'':'none';
  const hint=document.getElementById('f-lines-hint');
  if(hint)hint.textContent=libera
    ? 'Nessun DDT o contratto richiamato: indica descrizione, importo e IVA (es. vendita di un mezzo).'
    : 'Righe con unità di misura e quantità: l\'importo è quantità × prezzo.';
  fatturaCalc();
}
function fatturaCanoneDesc(c,periodoTxt){
  const forf=c.periodicita==='forfettario';
  return `${contrattoTipoNome(c)} — ${c.descrizione||c.oggetto||contrattoNum(c)} (contratto ${contrattoNum(c)})${forf?' · forfettario':(periodoTxt?` · periodo ${periodoTxt}`:'')}`;
}
function fatturaAddCanoneLine(c,opt){
  opt=opt||{};
  const forf=c.periodicita==='forfettario';
  const p=PERIODICITA[c.periodicita]||PERIODICITA.giornaliero;
  fatturaAddLine({canoneContrattoId:c.id,
    descrizione:fatturaCanoneDesc(c,opt.periodoTxt),
    um:forf?'':p.um,quantita:opt.qta!=null?opt.qta:1,prezzoUnitario:num(c.prezzo),aliquotaIva:c.aliquotaIva!=null?c.aliquotaIva:22});
}
function fatturaAddContratto(){
  const c=S.contratti.find(x=>x.id===(document.getElementById('f-contratto')||{}).value);
  if(!c||!contrattoIsCanone(c)){toast('Seleziona un contratto a canone (es. nolo o affitto)');return;}
  if(c.periodicita==='forfettario'){fatturaAddCanoneLine(c,{});return;}
  const periodo=[dmy(c.dataInizio),dmy(c.dataFine)].filter(Boolean).join(' – ');
  fatturaAddCanoneLine(c,{qta:contrattoPeriodoQta(c),periodoTxt:periodo});
}
/* Selettore del periodo di nolo/locazione: aggiorna la riga del canone (o la crea) */
function fatturaPeriodoNolo(){
  const c=S.contratti.find(x=>x.id===(document.getElementById('f-contratto')||{}).value);
  if(!c||!contrattoIsCanone(c)){toast('Seleziona un contratto di nolo o locazione');return;}
  const p=PERIODICITA[c.periodicita]||PERIODICITA.giornaliero;
  const row=document.querySelector(`#fatt-lines-body tr[data-canone="${c.id}"]`);
  const apply=(qta,periodoTxt)=>{
    if(row){row.querySelector('.f-qta').value=qta;row.querySelector('.f-desc').value=fatturaCanoneDesc(c,periodoTxt);fatturaCalc();}
    else fatturaAddCanoneLine(c,{qta,periodoTxt});
  };
  if(c.periodicita==='forfettario'){apply(1,'');toast('Riga forfettaria');return;}
  if(c.periodicita==='orario'){
    openModal2('Periodo di nolo / locazione',`<div class="form-grid"><div class="field col2"><label>Numero di ore</label><input id="np-ore" type="number" step="any" value="${row?num(row.querySelector('.f-qta').value)||1:1}"></div></div>`,()=>{
      const ore=num(document.getElementById('np-ore').value)||1;apply(ore,ore+' ore');return true;
    },{submitLabel:'Applica periodo'});
    return;
  }
  const dal0=c.dataInizio||'',al0=c.dataFine||'';
  openModal2('Periodo di nolo / locazione',`<div class="form-grid">
      <div class="field"><label>Dal</label><input id="np-dal" type="date" value="${dal0}"></div>
      <div class="field"><label>Al</label><input id="np-al" type="date" value="${al0}"></div>
      <div class="field col2"><span class="hint">La quantità (${p.um}) viene calcolata dal periodo indicato. Puoi comunque modificarla a mano nella riga.</span></div>
    </div>`,()=>{
    const dal=document.getElementById('np-dal').value,al=document.getElementById('np-al').value;
    if(dal&&al&&al<dal){toast('La data finale precede quella iniziale');return false;}
    const qta=periodoQta(c.periodicita,dal,al);
    apply(qta,[dmy(dal),dmy(al)].filter(Boolean).join(' – '));
    return true;
  },{submitLabel:'Applica periodo'});
}

function periodoQta(periodicita,dal,al){
  if(!dal||!al)return 1;
  const d1=new Date(dal),d2=new Date(al);
  if(isNaN(d1)||isNaN(d2)||d2<d1)return 1;
  const giorni=Math.round((d2-d1)/86400000)+1;
  if(periodicita==='giornaliero')return giorni;
  if(periodicita==='mensile')return Math.max(1,(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth())+1);
  if(periodicita==='annuale')return Math.max(1,d2.getFullYear()-d1.getFullYear()+1);
  return 1;
}
function contrattoPeriodoQta(c){return periodoQta(c.periodicita,c.dataInizio,c.dataFine);}

      <span><span class="strong">DDT ${d.numero}/${d.anno}</span> · ${dmy(d.data)}${d.trasporto?' · <span class="pill accent" style="font-size:10px">+ trasporto</span>':''}<div class="sub">${esc((d.righe[0]||{}).descrizione||'')}${d.righe.length>1?' +'+(d.righe.length-1):''}</div></span>
      <span class="meta">€ ${eur(tot)}</span></label>`;
  }).join('');

function fatturaSyncLines(){
  const ids=[...document.querySelectorAll('.f-ddt:checked')].map(el=>el.value);
  if(fatturaContratti.length){fatturaContratti=[];fatturaRenderChips();}
  const body=document.getElementById('fatt-lines-body');body.innerHTML='';
  ids.forEach(id=>{const d=S.ddt.find(x=>x.id===id);if(!d)return;
    d.righe.forEach(r=>{
      body.insertAdjacentHTML('beforeend',fatturaLineRow({
        descrizione:(r.descrizione||'')+`  (DDT ${d.numero}/${d.anno})`,um:r.um,quantita:r.quantita,
        prezzoUnitario:r.prezzoUnitario||0,aliquotaIva:r.aliquotaIva!=null?r.aliquotaIva:22}));});
    if(d.trasporto&&num(d.trasporto.prezzo)>0){
      const q=d.trasporto.tipo==='misura'?num(d.trasporto.quantita):1;
      body.insertAdjacentHTML('beforeend',fatturaLineRow({
        descrizione:`Trasporto merce (DDT ${d.numero}/${d.anno})${d.trasporto.tipo==='corpo'?' — a corpo':''}`,
        um:d.trasporto.tipo==='misura'?(d.trasporto.um||''):'A Viaggio',
        quantita:q,prezzoUnitario:num(d.trasporto.prezzo),aliquotaIva:22}));
    }
  });
  fatturaDDTAllLabel();
  fatturaUpdateMode();
}
function collectFatturaLines(){
  return [...document.querySelectorAll('#fatt-lines-body tr')].map(tr=>({
    descrizione:tr.querySelector('.f-desc').value.trim(),um:tr.querySelector('.f-um').value.trim(),
    quantita:num(tr.querySelector('.f-qta').value),prezzoUnitario:num(tr.querySelector('.f-prz').value),
    aliquotaIva:num(tr.querySelector('.f-iva').value),
    natura:(tr.querySelector('.f-natura')&&tr.querySelector('.f-natura').value.trim())||'',
  })).filter(r=>r.descrizione||r.quantita);
}
function fatturaTotals(righe){
  let imponibile=0;const per={};
  righe.forEach(r=>{const imp=num(r.quantita)*num(r.prezzoUnitario);imponibile+=imp;const a=num(r.aliquotaIva);per[a]=(per[a]||0)+imp;});
  let imposta=0;const riepilogo=Object.entries(per).map(([a,imp])=>{const iva=imp*num(a)/100;imposta+=iva;return{aliquota:num(a),imponibile:imp,imposta:iva};});
  return{imponibile,imposta,totale:imponibile+imposta,riepilogo};
}
function fatturaCalc(){
  const t=fatturaTotals(collectFatturaLines());const box=document.getElementById('f-tot');if(!box)return;
  box.innerHTML=`<div class="r"><span>Imponibile</span><span>€ ${eur(t.imponibile)}</span></div>
    ${t.riepilogo.map(r=>`<div class="r"><span>IVA ${r.aliquota}%</span><span>€ ${eur(r.imposta)}</span></div>`).join('')}
    <div class="r grand"><span>Totale fattura</span><span>€ ${eur(t.totale)}</span></div>`;
}
function saveFattura(id,anno){
  const clienteId=document.getElementById('f-cliente').value;
  if(!clienteId){toast('Seleziona il cliente');return false;}
  const righe=collectFatturaLines();
  if(righe.length===0){toast('Aggiungi almeno una riga');return false;}
  const ddtIds=[...document.querySelectorAll('.f-ddt:checked')].map(el=>el.value);
  const t=fatturaTotals(righe);
  const old=id?S.fatture.find(x=>x.id===id):null;
  if(old)(old.ddtIds||[]).forEach(did=>{const d=S.ddt.find(x=>x.id===did);if(d)d.fatturato=false;});
  const data={
    id:id||uid(),numero:parseInt(document.getElementById('f-num').value)||nextNumber('fattura',yearOf(document.getElementById('f-data').value)).numero,
    anno:yearOf(document.getElementById('f-data').value),data:document.getElementById('f-data').value||today(),
    clienteId,ddtIds,contrattoIds:[...fatturaContratti],contrattoId:fatturaContratti[0]||null,
    causaleManuale:document.getElementById('f-causale').value.trim(),
    libera:!fatturaHasRif(),
    righe,imponibile:t.imponibile,imposta:t.imposta,totale:t.totale,riepilogo:t.riepilogo,
    modalitaPagamento:document.getElementById('f-pag').value.trim(),scadenza:document.getElementById('f-scad').value,
    note:document.getElementById('f-note').value.trim(),
  };
  ddtIds.forEach(did=>{const d=S.ddt.find(x=>x.id===did);if(d)d.fatturato=true;});
  if(id){const i=S.fatture.findIndex(x=>x.id===id);S.fatture[i]=data;}
  else S.fatture.push(data);
  commitNumber('fattura',data.anno,data.numero);
  logAction(id?'Fattura modificata':'Fattura creata','Fattura '+data.numero+'/'+data.anno+' · '+(clienteName(data.clienteId)||''));
  persist();render();toast('Fattura '+data.numero+'/'+data.anno+' salvata');return true;
}

async function pdfDoc(){
  const hasJs=!!(window.jspdf&&window.jspdf.jsPDF);
  const t=docCtx&&docCtx.type;
  if(hasJs&&t==='ddt'&&docCtx.doc){try{pdfDDT(docCtx.doc);toast('PDF creato');return;}catch(e){console.error(e);}}
  if(hasJs&&t==='fattura'&&docCtx.doc){try{pdfFattura(docCtx.doc);toast('PDF creato');return;}catch(e){console.error(e);}}
  if(hasJs&&t==='contrattoRA'&&docCtx.doc){try{pdfContrattoRA(docCtx.doc);toast('PDF creato');return;}catch(e){console.error(e);}}
  if(hasJs&&t==='registro'&&docCtx.reg){try{pdfRegistro(docCtx.reg);toast('PDF creato');return;}catch(e){console.error(e);}}
  await pdfDocRaster();
}
async function pdfDocRaster(){
  const el=document.getElementById('doc-canvas');
  if(!(window.html2canvas&&window.jspdf)){toast('Uso la stampa del browser per il PDF…');printDoc();return;}
  toast('Creazione PDF…');
  try{
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const img=canvas.toDataURL('image/png');
    const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const imgH=canvas.height*pw/canvas.width;let heightLeft=imgH,pos=0;
    pdf.addImage(img,'PNG',0,pos,pw,imgH);heightLeft-=ph;
    while(heightLeft>0){pos-=ph;pdf.addPage();pdf.addImage(img,'PNG',0,pos,pw,imgH);heightLeft-=ph;}
    pdf.save((docCtx&&docCtx.filename?docCtx.filename:'documento')+'.pdf');
    toast('PDF creato');
  }catch(e){console.error(e);toast('Errore PDF: uso la stampa del browser');printDoc();}
}
/* ---- Generatore PDF testuale ---- */
const PDFM=12, PDFW=210, PDFRight=PDFW-PDFM;
function pdfHeader(pdf,title,numLine){
  const a=S.azienda||{};
  try{if(typeof LOGO_SRC!=='undefined'&&LOGO_SRC)pdf.addImage(LOGO_SRC,'PNG',PDFM,10,15,15);}catch(e){}
  pdf.setFont('helvetica','bold');pdf.setFontSize(13);pdf.setTextColor(178,38,30);
  pdf.text('CAVA BASALTO LAGHETTO srl',PDFM+18,15);
  pdf.setFont('helvetica','normal');pdf.setFontSize(7);pdf.setTextColor(70);
  let my=19;[
    'Sede legale: '+(a.sedeLegale||''),
    'Cava/Stab.: '+(a.stabilimento||''),
    'Tel. '+(a.telefono||'')+(a.cellulare?' · Cell. '+a.cellulare:'')+(a.web?' · '+a.web:''),
    [a.email,a.pec].filter(Boolean).join(' · '),
    'Cod.Fisc. '+(a.codiceFiscale||'')+' · Part.IVA '+(a.partitaIva||'')
  ].forEach(m=>{pdf.text(m,PDFM+18,my);my+=3.2;});
  pdf.setDrawColor(60);pdf.rect(PDFRight-46,10,46,17);
  pdf.setFont('helvetica','bold');pdf.setFontSize(10);pdf.setTextColor(20);
  pdf.text(title,PDFRight-23,15.5,{align:'center'});
  pdf.setFontSize(8.5);pdf.setFont('helvetica','normal');
  pdf.splitTextToSize(numLine,44).forEach((l,i)=>pdf.text(l,PDFRight-23,20.5+i*3.6,{align:'center'}));
  return Math.max(my,30)+2;
}
function pdfBox(pdf,x,y,w,h,label,value){
  pdf.setDrawColor(120);pdf.rect(x,y,w,h);
  pdf.setFontSize(5.8);pdf.setTextColor(120);pdf.setFont('helvetica','normal');
  pdf.text(String(label).toUpperCase(),x+1.6,y+3);
  pdf.setFontSize(8.3);pdf.setTextColor(20);
  pdf.splitTextToSize(String(value==null?'':value),w-3.2).forEach((l,i)=>{if(y+6.5+i*3.4<y+h)pdf.text(l,x+1.6,y+6.5+i*3.4);});
}
function pdfTable(pdf,x,y,cols,rows){
  const totalW=cols.reduce((s,c)=>s+c.w,0),headH=6;
  const drawHead=yy=>{pdf.setFillColor(238,240,242);pdf.rect(x,yy,totalW,headH,'F');pdf.setDrawColor(120);pdf.setFont('helvetica','bold');pdf.setFontSize(7.5);pdf.setTextColor(40);let cx=x;cols.forEach(c=>{pdf.text(c.title,c.align==='right'?cx+c.w-1.5:cx+1.6,yy+4,{align:c.align==='right'?'right':'left'});cx+=c.w;});return yy+headH;};
  let cy=drawHead(y),top=y;
  pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(20);
  rows.forEach(r=>{
    const cells=cols.map((c,i)=>pdf.splitTextToSize(String(r[i]==null?'':r[i]),c.w-3.2));
    const rh=Math.max(6,...cells.map(cl=>cl.length*3.5+2.5));
    if(cy+rh>282){pdf.setDrawColor(120);pdf.rect(x,top,totalW,cy-top);let cx=x;cols.forEach(c=>{cx+=c.w;if(cx<x+totalW-0.1)pdf.line(cx,top,cx,cy);});pdf.addPage();cy=drawHead(12);top=12;pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(20);}
    let cx=x;cols.forEach((c,i)=>{pdf.text(cells[i],c.align==='right'?cx+c.w-1.6:cx+1.6,cy+4,{align:c.align==='right'?'right':'left'});cx+=c.w;});
    pdf.setDrawColor(215);pdf.line(x,cy+rh,x+totalW,cy+rh);cy+=rh;
  });
  pdf.setDrawColor(120);pdf.rect(x,top,totalW,cy-top);let cx=x;cols.forEach(c=>{cx+=c.w;if(cx<x+totalW-0.1)pdf.line(cx,top,cx,cy);});
  return cy;
}

function pdfFlow(pdf,y){return {y:y||12,
  ensure(h){if(this.y+h>282){pdf.addPage();this.y=12;}},
  gap(h){this.y+=(h||3);}};}
function pdfPara(pdf,fl,txt,o){
  o=o||{};const size=o.size||9,lh=o.lh||(size*0.42+0.7);
  pdf.setFont('helvetica',o.bold?'bold':'normal');pdf.setFontSize(size);
  pdf.setTextColor(o.color?o.color[0]:20,o.color?o.color[1]:20,o.color?o.color[2]:20);
  const w=(o.w||(PDFRight-PDFM))-(o.x?o.x-PDFM:0);
  pdf.splitTextToSize(String(txt==null?'':txt),w).forEach(l=>{fl.ensure(lh+1);pdf.text(l,o.x||PDFM,fl.y);fl.y+=lh;});
}
function pdfH2(pdf,fl,txt){fl.ensure(9);fl.gap(3);pdfPara(pdf,fl,String(txt).toUpperCase(),{size:8.5,bold:true,color:[29,78,137]});fl.gap(1);}
function pdfLista(pdf,fl,txt,start){
  const items=String(txt||'').split('\n').map(s=>s.trim()).filter(Boolean);
  items.forEach((t,i)=>{
    const n=(start||1)+i;
    fl.ensure(8);
    pdf.setFont('helvetica','bold');pdf.setFontSize(9);pdf.setTextColor(20);
    const yStart=fl.y;pdf.text(n+'.',PDFM,yStart);
    pdfPara(pdf,fl,t,{size:9,x:PDFM+6});
    fl.gap(1.5);

function pdfFattura(f){
  const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');
  const cli=clienteById(f.clienteId)||{};
  let y=pdfHeader(pdf,'FATTURA',`n. ${f.numero}/${f.anno}\ndel ${dmy(f.data)}`);
  const cliBlock=[cli.ragioneSociale,cli.indirizzo,[cli.cap,cli.citta,cli.provincia?'('+cli.provincia+')':''].filter(Boolean).join(' '),cli.partitaIva?'P.IVA '+cli.partitaIva:'',cli.codiceFiscale?'C.F. '+cli.codiceFiscale:'',cli.sdi?'SDI '+cli.sdi:''].filter(Boolean).join('\n');
  pdfBox(pdf,PDFM,y,PDFRight-PDFM,24,'Spett.le',cliBlock);y+=26;
  if(fatturaRifLabel(f)){pdf.setFontSize(8);pdf.setTextColor(70);pdf.text('Riferimento: '+fatturaRifLabel(f),PDFM,y);y+=4;}
  const libera=!(f.righe||[]).some(r=>r.um||r.quantita);
  let cols,rows;
  if(libera){cols=[{title:'Descrizione',w:PDFRight-PDFM-56},{title:'IVA %',w:22,align:'right'},{title:'Importo €',w:34,align:'right'}];
    rows=(f.righe||[]).map(r=>[r.descrizione||'',qty(r.aliquotaIva),eur(num(r.importo!=null?r.importo:num(r.quantita||1)*num(r.prezzoUnitario)))]);
  }else{cols=[{title:'Descrizione',w:PDFRight-PDFM-96},{title:'U.M.',w:18,align:'right'},{title:'Q.tà',w:20,align:'right'},{title:'Prezzo',w:24,align:'right'},{title:'IVA%',w:14,align:'right'},{title:'Importo',w:20,align:'right'}];
    rows=(f.righe||[]).map(r=>{const imp=r.importo!=null?num(r.importo):num(r.quantita||0)*num(r.prezzoUnitario);return [r.descrizione||'',r.um||'',qty(r.quantita),eur(r.prezzoUnitario),qty(r.aliquotaIva),eur(imp)];});}
  y=pdfTable(pdf,PDFM,y,cols,rows)+4;
  const boxX=PDFRight-70;
  pdf.setFontSize(9);pdf.setTextColor(20);pdf.setFont('helvetica','normal');
  const line=(l,v,b)=>{pdf.setFont('helvetica',b?'bold':'normal');pdf.text(l,boxX,y);pdf.text('€ '+eur(v),PDFRight,y,{align:'right'});y+=5;};
  line('Imponibile',f.imponibile);line('IVA',f.imposta);pdf.setFontSize(10);line('TOTALE',f.totale,true);
  y+=3;pdf.setFont('helvetica','normal');pdf.setFontSize(8.5);pdf.setTextColor(40);
  if(f.modalitaPagamento)pdf.text('Pagamento: '+f.modalitaPagamento,PDFM,y-9);
  if(f.scadenza)pdf.text('Scadenza: '+dmy(f.scadenza),PDFM,y-4);
  pdf.setFontSize(6.5);pdf.setTextColor(90);
  pdf.splitTextToSize("Documento non valido ai fini fiscali ai sensi dell'art. 21 DPR 633/72. L'originale è disponibile presso il codice SDI fornito oppure nell'area riservata dell'Agenzia delle Entrate.",PDFRight-PDFM).forEach((l,i)=>pdf.text(l,PDFM,y+2+i*3));
  pdf.save((docCtx&&docCtx.filename?docCtx.filename:'Fattura')+'.pdf');
}
function emailDoc(){
  if(!docCtx)return;
  const e=docCtx.email||{};
  pdfDoc();
  toast('PDF scaricato: allegalo all&rsquo;email che si sta aprendo');
  const url=`mailto:${encodeURIComponent(e.to||'')}?subject=${encodeURIComponent(e.subject||'')}&body=${encodeURIComponent(e.body||'')}`;
  setTimeout(()=>{window.location.href=url;},600);
}

function stampaRegistroDDT(){
  const f=filtri.ddt;
  let rows=[...S.ddt];
  if(f.anno)rows=rows.filter(x=>String(x.anno)===String(f.anno));
  if(f.stato==='dafatt')rows=rows.filter(x=>!x.fatturato&&ddtStatoFattOf(x)==='fatturare');
  if(f.stato==='definire')rows=rows.filter(x=>!x.fatturato&&ddtStatoFattOf(x)==='definire');
  if(f.stato==='nonfatt')rows=rows.filter(x=>ddtStatoFattOf(x)==='nonfatturare');
  if(f.stato==='fatt')rows=rows.filter(x=>x.fatturato);
  rows.sort((a,b)=>(a.anno-b.anno)||(a.numero-b.numero));
  const sotto=[f.anno?('Anno '+f.anno):'Tutti gli anni',f.stato==='dafatt'?'da fatturare':(f.stato==='fatt'?'fatturati':'')].filter(Boolean).join(' · ');
  const totNetto=rows.reduce((s,x)=>s+num(x.nettoKg),0);
  const html=`<div class="doc">
    ${registroHead('REGISTRO DEI DOCUMENTI DI TRASPORTO',sotto)}

    tot:`Totale documenti: ${rows.length} · Netto complessivo: ${qty(totNetto)} Kg`};
  openPreview({type:'registro',reg,title:'Registro DDT',filename:'Registro_DDT'+(f.anno?'_'+f.anno:''),email:{to:'',subject:'Registro DDT',body:''}},html);

function saveNumerazione(){
  const y=new Date().getFullYear();
  const checks=[
    {type:'ddt',label:'DDT',docs:S.ddt,val:parseInt((document.getElementById('nx-ddt')||{}).value)},
    {type:'fattura',label:'fattura',docs:S.fatture,val:parseInt((document.getElementById('nx-fattura')||{}).value)},
    {type:'contratto',label:'contratto',docs:S.contratti,val:parseInt((document.getElementById('nx-contratto')||{}).value)},
  ];
  for(const c of checks){
    if(!c.val||c.val<1){toast('Numero non valido per '+c.label);return;}
    const clash=c.docs.filter(d=>d.anno===y&&d.numero>=c.val).sort((a,b)=>a.numero-b.numero)[0];
    if(clash){toast(`Conflitto: esiste già ${c.label} n. ${clash.numero}/${y}`);return;}
  }
  checks.forEach(c=>{S.counters[c.type][y]=c.val-1;});
  persist();render();toast('Numerazione aggiornata');
}
function ensureAziendaCliente(force){
  const a=S.azienda;if(!a||!Array.isArray(S.clienti))return;
  let c=S.clienti.find(x=>x.isAzienda)||(a.partitaIva?S.clienti.find(x=>x.partitaIva===a.partitaIva):null);
  let indirizzo=a.sedeLegale||'',cap='',citta='';
  const m=(a.sedeLegale||'').match(/(\d{5})\s+([^,–-]+)\s*$/);
  if(m){cap=m[1];citta=m[2].trim();indirizzo=a.sedeLegale.slice(0,m.index).replace(/[–—-]\s*$/,'').replace(/,\s*$/,'').trim();}
  const dati={ragioneSociale:a.ragioneSociale,partitaIva:a.partitaIva,codiceFiscale:a.codiceFiscale,
    indirizzo,cap,citta,telefono:a.telefono,email:a.email,pec:a.pec};
  if(c){for(const k in dati){if(force||c[k]==null||c[k]==='')c[k]=dati[k];}c.isAzienda=true;}
  else{S.clienti.push({id:uid(),...dati,isAzienda:true,note:'Dati dell\'azienda (usati come cedente nei DDT)'});}
}

function fmtBytes(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(0)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB';}
function attStats(){let count=0,bytes=0;[S.sicurezza,S.docamm,S.contrattiRA].forEach(arr=>(arr||[]).forEach(d=>(d.allegati||[]).forEach(f=>{count++;bytes+=Number(f.size)||0;})));return {count,bytes};}
function lastBackupInfo(){
  let d='';try{d=localStorage.getItem('cbl_last_backup')||'';}catch(e){}
  if(!d)return {txt:'mai eseguito',cls:'danger',days:null};
  const days=Math.round((new Date(today())-new Date(d))/86400000);
  const cls=days>=60?'danger':(days>=30?'warn':'ok');
  const txt=days<=0?'oggi':(days===1?'ieri':days+' giorni fa')+' ('+dmy(d)+')';
  return {txt,cls,days};
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    confirmDialog('Ripristinare questo backup?','I dati attuali verranno sostituiti.',async()=>{S=d;if(!S.settings)S.settings={theme:'light'};await persist();applyTheme();render();toast('Backup ripristinato');},'Ripristina');
  }catch(e){toast('File non valido');}};
  r.readAsText(file);input.value='';
}

/* Promemoria all'avvio: scadute + in scadenza entro 7 giorni (una volta al giorno) */
function promemoriaScadenze(){
  try{if(localStorage.getItem('cbl_promemoria_off')==='1')return;}catch(e){}
  let urgenti=[];
  try{urgenti=scadenzeUnificate(7);}catch(e){return;}
  if(!urgenti.length)return;
  const oggiKey=today();
  try{if(localStorage.getItem('cbl_promemoria')===oggiKey)return;}catch(e){}
  const cap=(arr,n)=>({vis:arr.slice(0,n),extra:Math.max(0,arr.length-n)});
  const scadute=cap(urgenti.filter(v=>v.gg<0),8);
  const imminenti=cap(urgenti.filter(v=>v.gg>=0),8);
  const riga=v=>`<div class="att">
    <span class="pill ${v.gg<0?'danger':'warn'}" style="min-width:74px;text-align:center">${v.gg<0?Math.abs(v.gg)+' gg fa':(v.gg===0?'oggi':'tra '+v.gg+' gg')}</span>
    <span style="flex:1">${esc(v.titolo)}<div class="sub">${esc(v.tipo)}${v.sotto?' · '+esc(v.sotto):''} · ${dmy(v.data)}</div></span>
    ${v.importo?`<span class="meta">€ ${eur(v.importo)}</span>`:''}
  </div>`;
  const nS=scadute.vis.length+scadute.extra, nI=imminenti.vis.length+imminenti.extra;

/* ===================== SINCRONIZZAZIONE CLOUD (DROPBOX) ===================== */
/* L'app (statica su GitHub Pages) salva/legge un unico file JSON nella cartella
   dell'app su Dropbox. Autenticazione OAuth2 PKCE con refresh token (offline),
   sicura senza segreti nel codice. Rilevamento conflitti tramite "rev" del file. */
const DBX_FILE='/gestionale.json';
let syncState='idle'; // idle | sync | ok | err | off
const DBX={
  ok:false, rev:null, _access:null, _accessExp:0,
  appKey(){try{return localStorage.getItem('cbl_dbx_appkey')||'';}catch(e){return '';}},
  setAppKey(k){try{localStorage.setItem('cbl_dbx_appkey',k||'');}catch(e){}},
  refresh(){try{return localStorage.getItem('cbl_dbx_refresh')||'';}catch(e){return '';}},
  connected(){return !!(this.appKey()&&this.refresh());},
  redirectUri(){return location.origin+location.pathname;},
  async _sha256b64url(str){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
    let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  },
  _rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a).map(b=>('0'+b.toString(16)).slice(-2)).join('');},
  async connect(){
    const key=this.appKey();
    if(!key){toast('Inserisci prima l\u2019App key di Dropbox');return;}
    const verifier=this._rand(48);
    const challenge=await this._sha256b64url(verifier);
    try{sessionStorage.setItem('cbl_dbx_verifier',verifier);}catch(e){}
    const u='https://www.dropbox.com/oauth2/authorize'
      +'?client_id='+encodeURIComponent(key)
      +'&response_type=code&code_challenge='+challenge+'&code_challenge_method=S256'
      +'&token_access_type=offline&redirect_uri='+encodeURIComponent(this.redirectUri());
    location.href=u;
  },
  async handleRedirect(){
    const p=new URLSearchParams(location.search);
    const code=p.get('code'); if(!code)return;
    const verifier=(()=>{try{return sessionStorage.getItem('cbl_dbx_verifier')||'';}catch(e){return '';}})();
    try{
      const body=new URLSearchParams({code,grant_type:'authorization_code',client_id:this.appKey(),
        code_verifier:verifier,redirect_uri:this.redirectUri()});
      const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
      const j=await r.json();
      if(j.refresh_token){try{localStorage.setItem('cbl_dbx_refresh',j.refresh_token);}catch(e){}}
      if(j.access_token){this._access=j.access_token;this._accessExp=Date.now()+(j.expires_in||14400)*1000-60000;}
    }catch(e){console.error(e);}
    // pulisco l'URL dai parametri OAuth
    history.replaceState({},'',this.redirectUri());
  },
  async token(){
    if(this._access&&Date.now()<this._accessExp)return this._access;
    const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:this.refresh(),client_id:this.appKey()});
    const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    if(!r.ok)throw new Error('Autenticazione Dropbox scaduta: riconnetti');
    const j=await r.json();
    this._access=j.access_token;this._accessExp=Date.now()+(j.expires_in||14400)*1000-60000;
    return this._access;
  },
  async download(){
    const t=await this.token();
    const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',
      headers:{'Authorization':'Bearer '+t,'Dropbox-API-Arg':JSON.stringify({path:DBX_FILE})}});
    if(r.status===409){this.rev=null;return null;} // file non ancora esistente
    if(!r.ok)throw new Error('Download Dropbox fallito ('+r.status+')');
    const meta=r.headers.get('dropbox-api-result');
    try{this.rev=JSON.parse(meta).rev;}catch(e){}
    const txt=await r.text();
    try{return JSON.parse(txt);}catch(e){return null;}
  },
  async upload(state){
    const t=await this.token();
    const mode=this.rev?{'.tag':'update',update:this.rev}:{'.tag':'overwrite'};
    const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',
      headers:{'Authorization':'Bearer '+t,'Content-Type':'application/octet-stream',
        'Dropbox-API-Arg':JSON.stringify({path:DBX_FILE,mode,mute:true})},
      body:JSON.stringify(state)});
    if(r.status===409)return 'conflict'; // rev cambiata: qualcun altro ha salvato
    if(!r.ok)throw new Error('Upload Dropbox fallito ('+r.status+')');
    const j=await r.json(); this.rev=j.rev; return 'ok';
  },
  disconnect(){try{localStorage.removeItem('cbl_dbx_refresh');}catch(e){}this._access=null;this.rev=null;this.ok=false;syncState='off';updateFoot();render();}
};
function syncStatus(s){syncState=s;updateFoot();const el=document.getElementById('sync-badge');if(el)el.outerHTML=syncBadge();}
function syncBadge(){
  if(!DBX.connected())return '<span id="sync-badge"></span>';
  const map={sync:['⟳ Sincronizzazione\u2026','grey'],ok:['☁︎ Sincronizzato','ok'],err:['⚠ Errore sync','danger'],idle:['☁︎ Cloud attivo','grey'],off:['',' ']};
  const [txt,cls]=map[syncState]||map.idle;
  return `<span id="sync-badge" class="pill ${cls}" style="font-weight:600">${txt}</span>`;
}
let pushTimer=null;
function syncPushSoon(){if(!DBX.connected())return;clearTimeout(pushTimer);pushTimer=setTimeout(syncPush,1500);}
async function syncPush(){
  if(!DBX.connected())return;
  syncStatus('sync');
  try{
    let res=await DBX.upload(S);
    if(res==='conflict'){
      const remote=await DBX.download();
      if(remote&&(remote._updatedAt||0)>(S._updatedAt||0)){
        await Store.set(KEY,remote);await loadState();render();
        toast('Sul cloud c\u2019era una versione più recente: caricata');
        syncStatus('ok');return;
      }
      res=await DBX.upload(S); // riprovo con la rev aggiornata
    }
    DBX.ok=(res==='ok');syncStatus('ok');
  }catch(e){console.error(e);syncStatus('err');}
}
async function syncPull(silent){
  if(!DBX.connected())return;
  if(!silent)syncStatus('sync');
  try{
    const remote=await DBX.download();
    if(remote&&(remote._updatedAt||0)>(S._updatedAt||0)){
      await Store.set(KEY,remote);await loadState();render();
      if(!silent)toast('Dati aggiornati dal cloud');
    }
    DBX.ok=true;syncStatus('ok');
  }catch(e){console.error(e);syncStatus('err');if(!silent)toast('Sync: '+e.message);}
}
async function syncNow(){await syncPull(false);await syncPush();}

/* ===================== ARCHIVIO ALLEGATI (separato dai dati) ===================== */
/* Gli allegati NON stanno più nel file dati (che così resta leggero e sincronizza in fretta).
   Sono salvati: localmente in IndexedDB e, se Dropbox è collegato, come file singoli in /allegati/.
   Nel gestionale ogni allegato è solo {key,nome,size,tipo}; il contenuto si recupera on-demand. */
let _idb=null;
function idbOpen(){return new Promise((res,rej)=>{if(_idb)return res(_idb);
  let r;try{r=indexedDB.open('cbl_gestionale',1);}catch(e){return rej(e);}
  r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('allegati'))db.createObjectStore('allegati');};
  r.onsuccess=()=>{_idb=r.result;res(_idb);};r.onerror=()=>rej(r.error);});}
function idbSet(key,val){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction('allegati','readwrite');t.objectStore('allegati').put(val,key);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}));}
function idbGet(key){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction('allegati','readonly');const rq=t.objectStore('allegati').get(key);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);}));}
function idbDel(key){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction('allegati','readwrite');t.objectStore('allegati').delete(key);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}));}
function dataUrlToBlob(u){return fetch(u).then(r=>r.blob());}
/* Dropbox: file binari singoli */
async function dbxDownloadFile(path){const t=await DBX.token();
  const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{'Authorization':'Bearer '+t,'Dropbox-API-Arg':JSON.stringify({path})}});
  if(r.status===409)return null; if(!r.ok)throw new Error('download '+r.status); return await r.blob();}
async function dbxUploadFile(path,blob){const t=await DBX.token();
  const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{'Authorization':'Bearer '+t,'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify({path,mode:{'.tag':'overwrite'},mute:true})},body:blob});
  if(!r.ok)throw new Error('upload '+r.status); return true;}
async function dbxDeleteFile(path){const t=await DBX.token();
  try{await fetch('https://api.dropboxapi.com/2/files/delete_v2',{method:'POST',headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({path})});}catch(e){} return true;}
/* Coda di caricamento su Dropbox (per allegati aggiunti offline o durante la migrazione) */
function attPending(){try{return JSON.parse(localStorage.getItem('cbl_att_pending')||'[]');}catch(e){return [];}}
function attPendingSave(a){try{localStorage.setItem('cbl_att_pending',JSON.stringify(a));}catch(e){}}
function attPendingAdd(key){const a=attPending();if(!a.includes(key)){a.push(key);attPendingSave(a);}}
function attPendingRemove(key){attPendingSave(attPending().filter(k=>k!==key));}
let attFlushing=false;
async function attFlushPending(){
  if(attFlushing||(!SB_ON()&&!DBX.connected()))return;attFlushing=true;
  try{for(const key of attPending()){
    const b=await idbGet(key); if(!b){attPendingRemove(key);continue;}
    try{ if(SB_ON())await sbUploadFile(key,b); else await dbxUploadFile('/allegati/'+key,b); attPendingRemove(key);}catch(e){break;}
  }}finally{attFlushing=false;}
}
function attKey(nome){return uid()+'_'+String(nome||'file').replace(/[^\w.\-]+/g,'_').slice(0,40);}
async function attPut(file){
  const key=attKey(file.name);
  await idbSet(key,file);            // blob in locale
  attPendingAdd(key); attFlushPending();
  return {key,nome:file.name,size:file.size,tipo:file.type};
}
async function attBlob(meta){
  let b=await idbGet(meta.key); if(b)return b;
  if(SB_ON()){b=await sbDownloadFile(meta.key); if(b)await idbSet(meta.key,b);}
  else if(DBX.connected()){b=await dbxDownloadFile('/allegati/'+meta.key); if(b)await idbSet(meta.key,b);}
  return b;
}
async function attDownload(key,nomeEnc){
  const nome=decodeURIComponent(nomeEnc||key);
  try{
    const b=await attBlob({key});
    if(!b){toast('Allegato non ancora disponibile su questo dispositivo: attendi la sincronizzazione');return;}
    const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=nome;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){toast('Impossibile aprire l\u2019allegato');}
}
async function attRemove(key){try{await idbDel(key);}catch(e){}attPendingRemove(key);if(SB_ON()){try{await sbDeleteFile(key);}catch(e){}}else if(DBX.connected()){try{await dbxDeleteFile('/allegati/'+key);}catch(e){}}}
async function attRemoveAll(list){for(const f of (list||[])){if(f&&f.key)await attRemove(f.key);}}
/* UI generica per gli allegati in modifica */
async function attAddFiles(input,arr,relist){
  const files=[...input.files];input.value='';
  for(const file of files){
    if(file.size>MAX_FILE_MB*1024*1024){toast(`"${file.name}" supera ${MAX_FILE_MB} MB`);continue;}
    try{arr.push(await attPut(file));relist();}catch(e){toast('Errore nel salvataggio dell\u2019allegato');}
  }
}
function attRow(f,i,rmFn){
  return `<div class="att">
    <span class="ic">${svg(IC.clip,1.9)}</span>
    <a href="#" onclick="attDownload('${f.key}','${encodeURIComponent(f.nome||'').replace(/'/g,'%27')}');return false" title="Apri o scarica">${esc(f.nome)}</a>
    <span class="meta">${(f.size/1024).toFixed(0)} KB</span>
    ${rmFn?`<button type="button" class="rm" title="Rimuovi" onclick="${rmFn}(${i})">${svg(IC.trash,2)}</button>`:''}
  </div>`;
}
function attListHtml(arr,rmFn){return arr.length?arr.map((f,i)=>attRow(f,i,rmFn)).join(''):`<div class="sub" style="padding:8px 2px">Nessun file allegato.</div>`;}
/* Migrazione: sposta i vecchi allegati (dataUrl nei dati) nell'archivio separato */
async function attMigrateLegacy(){
  let changed=false;
  for(const arr of [S.sicurezza,S.docamm,S.contrattiRA]){
    for(const doc of (arr||[])){
      for(const f of (doc.allegati||[])){
        if(f&&f.dataUrl&&!f.key){
          try{const key=attKey(f.nome);const blob=await dataUrlToBlob(f.dataUrl);await idbSet(key,blob);attPendingAdd(key);f.key=key;delete f.dataUrl;changed=true;}catch(e){}
        }
      }
    }
  }
  if(changed)await persist();
}
