  SB_ARRAYS.forEach(c=>{const m={};(S[c]||[]).forEach(x=>{if(x&&x.id!=null)m[x.id]=JSON.stringify(x);});sbSnap[c]=m;});
  SB_META.forEach(k=>{sbSnap['meta:'+k]=JSON.stringify(S[k]||{});}); }
/* Salvataggio incrementale: invia solo i record cambiati */
function sbPushSoon(){ if(!SB_ON()||sbBooting)return; clearTimeout(sbPushTimer); sbPushTimer=setTimeout(sbPush,900); }
async function sbPush(){
  if(!SB_ON()||!sbClient)return;
  if(!navigator.onLine){ sbOffline=true; syncStatusSB('offline'); return; }
  const now=new Date().toISOString(); const up=[];
  SB_ARRAYS.forEach(c=>{ const cur={}; (S[c]||[]).forEach(x=>{if(x&&x.id!=null)cur[x.id]=x;}); const snap=sbSnap[c]||{};
    Object.keys(cur).forEach(id=>{const js=JSON.stringify(cur[id]); if(snap[id]!==js)up.push({collection:c,id:String(id),data:cur[id],updated_at:now,deleted:false});});
    Object.keys(snap).forEach(id=>{if(!(id in cur))up.push({collection:c,id:String(id),data:{},updated_at:now,deleted:true});});
  });
  SB_META.forEach(k=>{const js=JSON.stringify(S[k]||{}); if(sbSnap['meta:'+k]!==js)up.push({collection:'meta',id:k,data:S[k]||{},updated_at:now,deleted:false});});
  if(!up.length){sbOffline=false;syncStatusSB('ok');return;}
  syncStatusSB('sync');
  try{ const {error}=await sbClient.from('records').upsert(up,{onConflict:'collection,id'}); if(error)throw error; sbBuildSnapshot(); sbOffline=false; syncStatusSB('ok'); }
  catch(e){ console.error(e); sbOffline=!navigator.onLine; syncStatusSB(sbOffline?'offline':'err'); }
}
/* Al ritorno della connessione: adotta le modifiche altrui sui record NON toccati da noi,
   e per i record che abbiamo cambiato offline rileva i conflitti (opzione B: scegli tu). */
async function sbReconcile(){
  if(!SB_ON()||!sbClient||!navigator.onLine)return;
  syncStatusSB('sync');
  const changed=sbLocalDiffKeys();
  let rows; try{ rows=await sbFetchAll(); }catch(e){ sbOffline=true; syncStatusSB('offline'); return; }
  const server={}; rows.forEach(r=>{ server[r.collection+'::'+r.id]=r; });
  const conflicts=[];
  // adotto dal server tutto ciò che NON abbiamo cambiato in locale
  rows.forEach(r=>{
    if(r.collection==='meta'){ if(!changed.meta[r.id]) sbApplyRow(r); return; }
    if(!SB_ARRAYS.includes(r.collection))return;
    const ourSet=changed.arr[r.collection];
    if(!(ourSet&&ourSet.has(String(r.id)))) sbApplyRow(r);
  });
  // rilevo conflitti su meta cambiati
  SB_META.forEach(k=>{ if(!changed.meta[k])return;
    const sr=server['meta::'+k]; const baseJson=sbSnap['meta:'+k];
    const serverJson=sr?JSON.stringify(sr.deleted?{}:sr.data):JSON.stringify({});
    const localJson=JSON.stringify(S[k]||{});
    if(serverJson!==baseJson && serverJson!==localJson)
      conflicts.push({coll:'meta',id:k,mine:S[k]||{},theirs:sr&&!sr.deleted?sr.data:{},label:'Impostazioni: '+k});
  });
  // rilevo conflitti sui record (array) cambiati
  SB_ARRAYS.forEach(c=>{ const ourSet=changed.arr[c]; if(!ourSet)return;
    ourSet.forEach(id=>{
      const sr=server[c+'::'+id]; const baseJson=(sbSnap[c]||{})[id];
      const rec=(S[c]||[]).find(x=>String(x.id)===String(id));
      const localJson=rec?JSON.stringify(rec):undefined;
      const serverJson=(sr&&!sr.deleted)?JSON.stringify(sr.data):undefined;
      const serverChanged=(serverJson!==baseJson);
      if(serverChanged && serverJson!==localJson)
        conflicts.push({coll:c,id:String(id),mine:rec||null,theirs:(sr&&!sr.deleted)?sr.data:null,label:sbRecordLabel(c,rec||(sr&&sr.data))});
      else if(serverChanged && serverJson===localJson){ // stessa modifica: allineo lo snapshot, niente push
        (sbSnap[c]=sbSnap[c]||{})[id]=serverJson;
      }
    });
  });
  if(conflicts.length){ sbResolveConflicts(conflicts); return; }
  await Store.set(KEY,S); render();
  await sbPush(); attFlushPending(); sbSubscribe();
}
function sbRecordLabel(c,rec){ rec=rec||{};
  switch(c){
    case 'clienti': return 'Cliente: '+(rec.ragioneSociale||rec.nome||'—');
    case 'ddt': return 'DDT '+(rec.numero||'')+'/'+(rec.anno||'');
    case 'fatture': return 'Fattura '+(rec.numero||'')+'/'+(rec.anno||'');
    case 'contratti': return 'Contratto '+(rec.numero||'')+'/'+(rec.anno||'');
    case 'contrattiRA': return 'Contratto R.A. '+(rec.numero||'')+'/'+(rec.anno||'');
    case 'listini': return 'Listino: '+(rec.nome||'—');
    case 'materiali': return 'Materiale: '+(rec.descrizione||'—');
    case 'mezzi': return 'Mezzo: '+(rec.targa||rec.nome||'—');
    case 'destinazioni': return 'Destinazione: '+(rec.indirizzo||rec.nome||'—');
    case 'scadenze': return 'Scadenza: '+(rec.descrizione||'—');
    case 'sicurezza': return 'Sicurezza: '+(rec.categoria||'—');
    case 'docamm': return 'Documento: '+(rec.descrizione||'—');
    default: return c+' · '+(rec.nome||rec.descrizione||rec.id||'—');
  }
}
function sbResolveConflicts(conflicts){
  window._sbConflicts=conflicts;
  const body=`<div class="note">${svg(IC.shield)}<div>Mentre eri offline, ${conflicts.length===1?'un elemento è stato modificato':'<b>'+conflicts.length+'</b> elementi sono stati modificati'} anche da un altro operatore. Scegli quale versione tenere.</div></div>
    <div class="att-list">${conflicts.map((k,i)=>`
      <div class="cf-row">
        <div class="strong">${esc(k.label)}</div>
        <div class="cf-opts">
          <label class="cf-opt"><input type="radio" name="cf${i}" value="mine" checked> Tieni la mia${k.mine===null?' (eliminato da me)':''}</label>
          <label class="cf-opt"><input type="radio" name="cf${i}" value="theirs"> Tieni quella online${k.theirs===null?' (eliminato online)':''}</label>
          <a href="#" class="linklike" onclick="sbShowDiff(${i});return false">Vedi differenze</a>
        </div>
        <div id="cf-diff-${i}" class="cf-diff" style="display:none"></div>
      </div>`).join('')}</div>`;
  openModal('Conflitti da risolvere',body,()=>{ sbApplyConflictChoices(); return true; },{wide:true,submitLabel:'Applica le scelte'});
}
function sbShowDiff(i){ const k=(window._sbConflicts||[])[i]; const el=document.getElementById('cf-diff-'+i); if(!k||!el)return;
  const show=el.style.display==='none'; el.style.display=show?'flex':'none';
  if(show)el.innerHTML=`<div class="cf-col"><div class="sub">La mia</div><pre>${esc(JSON.stringify(k.mine,null,1)||'(eliminato)')}</pre></div>
    <div class="cf-col"><div class="sub">Online</div><pre>${esc(JSON.stringify(k.theirs,null,1)||'(eliminato)')}</pre></div>`;
}
async function sbApplyConflictChoices(){
  const conflicts=window._sbConflicts||[];
  conflicts.forEach((k,i)=>{
    const sel=((document.querySelector('input[name="cf'+i+'"]:checked')||{}).value)||'mine';
    if(sel!=='theirs')return; // 'mine' resta com'è e verrà inviato dal push
    if(k.coll==='meta'){ S[k.id]=k.theirs||{}; sbSnap['meta:'+k.id]=JSON.stringify(S[k.id]||{}); return; }
    const arr=S[k.coll]||(S[k.coll]=[]); const idx=arr.findIndex(x=>String(x.id)===String(k.id));
    if(k.theirs===null){ if(idx>-1)arr.splice(idx,1); (sbSnap[k.coll]=sbSnap[k.coll]||{}); delete sbSnap[k.coll][k.id]; }
    else { if(idx>-1)arr[idx]=k.theirs; else arr.push(k.theirs); (sbSnap[k.coll]=sbSnap[k.coll]||{})[k.id]=JSON.stringify(k.theirs); }
  });
  window._sbConflicts=null;
  await Store.set(KEY,S); render();
  await sbPush(); attFlushPending(); sbSubscribe();
  toast('Conflitti risolti e dati sincronizzati');
}
/* Tempo reale: applica i cambiamenti degli altri operatori */
function sbApplyRow(row){
  if(!row||!row.collection)return; const c=row.collection;
  if(c==='meta'){ if(SB_META.includes(row.id)){S[row.id]=row.deleted?{}:row.data;sbSnap['meta:'+row.id]=JSON.stringify(S[row.id]||{});} return; }
  if(!SB_ARRAYS.includes(c))return;
  const arr=S[c]||(S[c]=[]); const idx=arr.findIndex(x=>String(x.id)===String(row.id));
  if(row.deleted){ if(idx>-1)arr.splice(idx,1); } else { if(idx>-1)arr[idx]=row.data; else arr.push(row.data); }
  const m=sbSnap[c]||(sbSnap[c]={}); if(row.deleted)delete m[row.id]; else m[row.id]=JSON.stringify(row.data);
}
function sbOnRemote(payload){ const row=(payload.new&&payload.new.collection)?payload.new:payload.old; sbApplyRow(row);
  clearTimeout(sbRenderTimer); sbRenderTimer=setTimeout(()=>{Store.set(KEY,S);render();updateFoot();},300); }
function sbSubscribe(){ if(!sbClient)return; if(sbChannel){try{sbClient.removeChannel(sbChannel);}catch(e){}}
  sbChannel=sbClient.channel('rec-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:'records'},sbOnRemote).subscribe(); }
/* Allegati su Supabase Storage */
async function sbUploadFile(key,blob){ sbInit(); const {error}=await sbClient.storage.from('allegati').upload(key,blob,{upsert:true,contentType:(blob&&blob.type)||'application/octet-stream'}); if(error)throw error; return true; }
async function sbDownloadFile(key){ sbInit(); const {data,error}=await sbClient.storage.from('allegati').download(key); if(error)return null; return data; }
async function sbDeleteFile(key){ sbInit(); try{await sbClient.storage.from('allegati').remove([key]);}catch(e){} return true; }
/* Avvio in modalità Supabase */
async function sbStart(){
  // 1) AVVIO IMMEDIATO dalla copia locale: mostra subito il gestionale
  sbBooting=true;
  await loadState(); sbBuildSnapshot();
  applyTheme();renderNav();render();updateFoot();
  if(!window._sbNetHooked){ window._sbNetHooked=true;
    window.addEventListener('online',()=>{ toast('Connessione ripristinata: sincronizzo…'); sbReconcile(); });
    window.addEventListener('offline',()=>{ sbOffline=true; syncStatusSB('offline'); });
  }
  sbSubscribe();
  // 2) SINCRONIZZAZIONE IN SOTTOFONDO (non blocca l'apertura)
  syncStatusSB('sync');
  sbBackgroundSync();
}
async function sbBackgroundSync(){
  try{
    const changed=sbLocalDiffKeys();
    const hasLocal=Object.keys(changed.meta).length||Object.values(changed.arr).some(s=>s&&s.size);
    if(hasLocal){
      // ci sono modifiche locali non ancora inviate: riconcilia (gestisce eventuali conflitti)
      sbBooting=false; await sbReconcile();
    }else{
      const rows=await sbFetchAll();
      const blob=sbBuildBlob(rows); blob._updatedAt=Date.now();
      await Store.set(KEY,blob); await loadState(); sbBuildSnapshot();
      sbBooting=false; render();
    }
    sbOffline=false; syncStatusSB('ok');
  }catch(e){
    console.warn('Sincronizzazione in sottofondo non riuscita, uso la copia locale',e);
    sbBooting=false; sbOffline=true; syncStatusSB('offline');
  }
  attFlushPending(); if(!window._attTimer){window._attTimer=setInterval(attFlushPending,60000);}
}
function commonBootTail(){
  updateClock();setInterval(updateClock,1000);
  updateWeather();setInterval(updateWeather,30*60*1000);
  setTimeout(promemoriaScadenze,600);setTimeout(promemoriaBackup,1500);
}
/* Schermata di login */
function sbShowLogin(msg){
  const ov=document.getElementById('sb-login'); if(!ov)return; ov.style.display='flex';
  ov.innerHTML=`<div class="sb-card">
    <div class="sb-logo"><img src="${LOGO_SRC||''}" alt="" onerror="this.style.display='none'"></div>
    <h2>Gestionale Cava Basalto Laghetto</h2>
    <p class="sub">Accedi con le credenziali operatore.</p>
    <div class="field"><label>Email</label><input id="sbl-email" type="email" autocomplete="username" placeholder="nome@azienda.it"></div>
    <div class="field"><label>Password</label><input id="sbl-pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')sbLoginSubmit()"></div>
    <div id="sbl-err" class="sb-err">${msg?esc(msg):''}</div>
    <button id="sbl-btn" class="btn primary" style="width:100%;justify-content:center" onclick="sbLoginSubmit()">Accedi</button>
    <div class="sb-alt" id="sbl-offline">${navigator.onLine?'':'Nessuna connessione: per il primo accesso su questo dispositivo serve internet. Dopo il primo accesso potrai lavorare anche offline.'}</div>
  </div>`;
  setTimeout(()=>{const e=document.getElementById('sbl-email');if(e)e.focus();},50);
}
async function sbLoginSubmit(){
  const email=(document.getElementById('sbl-email').value||'').trim();
  const pw=document.getElementById('sbl-pw').value||'';
  const btn=document.getElementById('sbl-btn'), err=document.getElementById('sbl-err');
  if(!email||!pw){err.textContent='Inserisci email e password';return;}
  btn.disabled=true;btn.textContent='Accesso in corso…';err.textContent='';
  try{ await sbLogin(email,pw); document.getElementById('sb-login').style.display='none'; await sbStart(); commonBootTail(); }
  catch(e){ err.textContent='Accesso non riuscito: '+((e&&e.message)||'controlla email e password'); btn.disabled=false;btn.textContent='Accedi'; }
}
function sbUseLocal(){ try{localStorage.setItem('cbl_backend','local');}catch(e){} location.href=location.origin+location.pathname; }
/* Attivazione + migrazione dati dalla versione attuale */
function sbMigraDialog(){
  const body=`<div class="note">${svg(IC.list)}<div>Questa operazione copia <b>tutti i dati attuali</b> (e gli allegati) su Supabase e attiva la modalità multi-operatore. La versione attuale resta come copia. Accedi con un account operatore per procedere.</div></div>
    <div class="form-grid">
      <div class="field col2"><label>Email operatore</label><input id="sbm-email" type="email" placeholder="nome@azienda.it"></div>
      <div class="field col2"><label>Password</label><input id="sbm-pw" type="password"></div>
    </div>
    <div id="sbm-log" class="sub" style="margin-top:10px"></div>`;
  openModal('Attiva Supabase e migra i dati',body,async()=>{
    const email=(document.getElementById('sbm-email').value||'').trim(), pw=document.getElementById('sbm-pw').value||'';
    const log=document.getElementById('sbm-log');
    if(!email||!pw){log.textContent='Inserisci email e password.';return false;}
    log.textContent='Accesso…';
    try{
      await sbLogin(email,pw);
      log.textContent='Invio dati su Supabase…';
      sbSnap={}; await sbPush();
      log.textContent='Caricamento allegati…';
      for(const arr of [S.sicurezza,S.docamm,S.contrattiRA]) for(const d of (arr||[])) for(const f of (d.allegati||[])){
        if(!f||!f.key)continue; try{const b=await attBlob({key:f.key}); if(b)await sbUploadFile(f.key,b);}catch(e){}
      }
      try{localStorage.setItem('cbl_backend','supabase');}catch(e){}
      log.textContent='Fatto! Riavvio in modalità multi-operatore…';
      setTimeout(()=>location.href=location.origin+location.pathname,900);
      return false; // resto nel modale col messaggio finale
    }catch(e){ log.textContent='Errore: '+((e&&e.message)||'riprova'); return false; }
  },{wide:false,submitLabel:'Attiva e migra'});
}

/* ===================== BOOT ===================== */
(async function(){
  const qp=new URLSearchParams(location.search);
  if(qp.get('backend')==='local'){ try{localStorage.setItem('cbl_backend','local');}catch(e){} history.replaceState({},'',location.origin+location.pathname); }
  if(SB_ON()){
    if(!window.supabase||!window.supabase.createClient){ sbShowLogin('Impossibile caricare la libreria (connessione assente?). Riprova o usa la modalità locale.'); return; }
    sbInit();
    const sess=await sbSession();
    if(!sess){ sbShowLogin(); return; }
    try{ await sbStart(); commonBootTail(); }
    catch(e){ console.error(e); sbShowLogin('Errore di caricamento: '+((e&&e.message)||'')); }
    return;
  }
  await DBX.handleRedirect();
  await loadState();
  applyTheme();renderNav();render();updateFoot();
  updateClock();setInterval(updateClock,1000);
  updateWeather();setInterval(updateWeather,30*60*1000);
  if(DBX.connected()){ await syncPull(true); attFlushPending(); setInterval(()=>{syncPull(true);attFlushPending();},60000); }
  setTimeout(promemoriaScadenze,600);setTimeout(promemoriaBackup,1500);
})();
</script>
