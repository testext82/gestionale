<style>
  :root{
    --bg:#eef0f3; --surface:#ffffff; --surface-2:#f7f8fa;
    --ink:#1a222e; --muted:#5c6773; --faint:#8a94a0;
    --line:#dde1e7; --line-strong:#c7cdd6;
    --basalt:#1b2430; --basalt-2:#242f3d;
    --accent:#c07a3e; --accent-ink:#ffffff; --accent-soft:#f6ece1;
    --danger:#b3261e; --danger-soft:#fbe9e7;
    --ok:#1f7a4d; --ok-soft:#e6f3ec; --warn:#8a5a00; --warn-soft:#fbf1dd;
    --radius:8px; --radius-sm:5px;
    --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 16px rgba(20,30,45,.06);
    --mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="energy"]{
    --bg:#0d1117; --surface:#161b22; --surface-2:#1b222c;
    --ink:#e6edf3; --muted:#9aa7b4; --faint:#6b7684;
    --line:#242c37; --line-strong:#323b47;
    --basalt:#080b10; --basalt-2:#11161d;
    --accent:#d98a4b; --accent-soft:#2a2016;
    --danger:#f0776c; --danger-soft:#3a1c19;
    --ok:#4cc38a; --ok-soft:#14271e; --warn:#e0b062; --warn-soft:#2c2416;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;transition:background .2s,color .2s}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
  a{color:var(--accent)}

  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .sidebar{background:var(--basalt);color:#c9d2de;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:16px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand .mark{display:flex;align-items:center;gap:11px}
  .brand .logo-img{width:38px;height:38px;flex:none;border-radius:9px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .brand .name{font-weight:750;color:#fff;font-size:14.5px;line-height:1.1;letter-spacing:-.02em}
  .brand .sub{font-size:11px;color:#8a97a8;margin-top:3px;letter-spacing:.02em}
  nav{padding:10px 8px;overflow-y:auto;flex:1}
  .nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#6f7d90;padding:14px 12px 6px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#c2ccda;padding:8px 12px;border-radius:6px;margin:1px 0;font-size:13.5px}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:var(--accent);color:#fff;font-weight:600}
  .nav-item .ico{width:17px;height:17px;flex:none;opacity:.9}
  .nav-item .badge{margin-left:auto;background:rgba(255,255,255,.14);color:#dfe6ef;font-size:11px;padding:1px 7px;border-radius:20px;font-weight:600}
  .nav-item.active .badge{background:rgba(255,255,255,.22);color:#fff}
  .sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#77839a}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
  .topbar h1{font-size:19px}
  .topbar .desc{color:var(--muted);font-size:12.5px;margin-top:2px}
  .topbar .spacer{flex:1}
  .content{padding:26px;max-width:1180px;width:100%;margin:0 auto}

  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--radius-sm);font-weight:550;transition:.12s;white-space:nowrap}
  .btn:hover{background:var(--surface-2);border-color:var(--faint)}
  .btn svg{width:16px;height:16px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(.94)}
  .btn.danger{background:var(--surface);border-color:var(--danger);color:var(--danger)}
  .btn.danger:hover{background:var(--danger-soft)}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:5px}
  .icon-btn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink)}
  .icon-btn.sm{width:30px;height:30px}
  .icon-btn.danger:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .card-head h2{font-size:15px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .search{position:relative;flex:1;min-width:200px;max-width:360px}
  .search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap}
  td.actions{text-align:right;white-space:nowrap}
  td.actions .icon-btn{margin-left:4px;display:inline-grid;vertical-align:middle}
  .strong{font-weight:600}.mono{font-family:var(--mono)}
  .sub{color:var(--muted);font-size:12.5px}
  .empty{padding:48px 20px;text-align:center;color:var(--muted)}
  .empty svg{width:40px;height:40px;color:var(--line-strong);margin-bottom:10px}
  .empty h3{color:var(--ink);font-size:15px;margin-bottom:4px}

  .stato-sel{font-size:12px;font-weight:700;border-radius:20px;padding:3px 8px;border:1px solid var(--line);cursor:pointer;background:var(--surface)}
  .stato-sel.s-definire{color:var(--accent);border-color:var(--accent)}
  .stato-sel.s-fatturare{color:var(--warn);border-color:var(--warn)}
  .stato-sel.s-nonfatturare{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.accent{background:var(--accent-soft);color:var(--accent)}
  .pill.grey{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
  .pill.danger{background:var(--danger-soft);color:var(--danger)}
  .att-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .att{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
  .att .ic{display:flex;color:var(--muted);flex:none}
  .att .ic svg{width:15px;height:15px}
  .att a{flex:1;color:var(--text);text-decoration:none;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att a:hover{color:var(--accent);text-decoration:underline}
  .att .meta{font-size:11px;color:var(--faint);flex:none}
  .att .rm{color:var(--danger);border:1px solid var(--line);background:var(--surface);width:28px;height:28px;border-radius:5px;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .att .rm:hover{background:var(--danger-soft)}
  .att .rm svg{width:14px;height:14px}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .stat[onclick]{transition:transform .08s ease,border-color .12s ease}
  .stat[onclick]:hover{transform:translateY(-2px);border-color:var(--accent)}
  .stat.hot .v{color:var(--danger)}
  .stat-grid.six{grid-template-columns:repeat(3,1fr)}
  .stat-sub{font-size:12px;font-weight:600;margin-top:4px}
  .stat-sub.up{color:var(--ok)} .stat-sub.down{color:var(--danger)}
  .dash-hi{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .dash-hello{font-size:20px;font-weight:800;color:var(--text)}
  .dash-az{color:var(--accent)}
  .dash-date{font-size:13px;color:var(--muted);margin-top:2px}
  .dash-chips{display:flex;gap:8px;flex-wrap:wrap}
  .dash-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .dash-chip svg{width:14px;height:14px}
  .dash-chip.danger{border-color:var(--danger);color:var(--danger);background:transparent}

<script>
/* ===================== STORAGE ===================== */
const Store = {
  async get(key){
    try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(key); return r?JSON.parse(r.value):null; } }catch(e){}
    try{ const v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; }
  },
  async set(key,value){
    const s=JSON.stringify(value);
    try{ if(window.storage&&window.storage.set){ await window.storage.set(key,s); return true; } }catch(e){ console.error(e); }
    try{ localStorage.setItem(key,s); return true; }catch(e){ return false; }
  }
};
const KEY='cbl_gestionale_v2';
const LOGO_SRC=(document.querySelector('.logo-img')||{}).src||'';

/* ===================== STATO ===================== */
let S = {
  azienda:{
    ragioneSociale:'CAVA BASALTO LAGHETTO srl',
    sedeLegale:'Via Claudio Monteverdi, 16 – 00198 Roma',
    stabilimento:'Via Casilina Km. 22,500 – 00077 Laghetto di Montecompatri (Rm)',
    telefono:'06.9476034', cellulare:'338/6673147', web:'www.cavabasalto.com',
    email:'cavabasalto@virgilio.it', pec:'cava.basalto.laghetto@legalmail.it',
    codiceFiscale:'08188290582', partitaIva:'01983311000',
    altro:'Trib. Roma n. 1497/88 · C.C.I.A.A. n. 651434 · Cap. Soc. € 43.160,00 i.v.'
  },
  clienti:[], destinazioni:[], materiali:[], unitaMisura:[], mezzi:[], causali:[],
  listini:[], contratti:[], compilatori:[], modalitaPagamento:[], contrattoTipi:[],
  ddt:[], fatture:[], sicurezza:[], sicCategorie:[], aspetti:[], docamm:[], scadenze:[], scadCategorie:[], contrattiRA:[],
  counters:{ ddt:{}, fattura:{}, contratto:{}, contrattoRA:{} },
  settings:{ theme:'light' }
};

async function loadState(){
  const data=await Store.get(KEY);
  if(data){ S=Object.assign(S,data); S.azienda=Object.assign({}, S.azienda, data.azienda||{}); }
  if(!data){
    // SOLO al primissimo avvio (nessun dato salvato): semina i valori di default
    if(!Array.isArray(S.unitaMisura)||S.unitaMisura.length===0) seedUnita();
    if(!Array.isArray(S.causali)||S.causali.length===0) seedCausali();
    if(!Array.isArray(S.modalitaPagamento)||S.modalitaPagamento.length===0) seedModPag();
    if(!Array.isArray(S.aspetti)||S.aspetti.length===0) seedAspetti();
  }else{
    // dati già presenti: rispetta ciò che c'è (anche liste vuote), non ripristinare i default
    if(!Array.isArray(S.unitaMisura)) S.unitaMisura=[];
    if(!Array.isArray(S.causali)) S.causali=[];
    if(!Array.isArray(S.modalitaPagamento)) S.modalitaPagamento=[];
    if(!Array.isArray(S.aspetti)) S.aspetti=[];
  }
  if(!Array.isArray(S.listini)) S.listini=[];
  if(!S.listini.some(l=>l.tipo==='default')) S.listini.push({id:uid(),nome:'Listino base (predefinito)',tipo:'default',voci:[]});
  if(!Array.isArray(S.contratti)) S.contratti=[];
  if(!Array.isArray(S.contrattoTipi)||S.contrattoTipi.length===0) S.contrattoTipi=CONTRATTO_TIPI_DEF.map(t=>({...t}));
  if(!S.counters.contratto) S.counters.contratto={};
  S.contratti.forEach(c=>{if(!c.tipo)c.tipo='fornitura';});
  // numero progressivo retroattivo per i contratti privi di numero
  const senzaNumero=S.contratti.filter(c=>c.numero==null);
  if(senzaNumero.length){
    senzaNumero.forEach(c=>{
      const anno=c.dataInizio?new Date(c.dataInizio).getFullYear():(c.anno||new Date().getFullYear());
      c.anno=anno;
      const n=(S.counters.contratto[anno]||0)+1;
      c.numero=n; S.counters.contratto[anno]=n;
      if(c.nome&&!c.oggetto)c.oggetto=c.nome;
    });
  }
  // cache tipo (nome + canone) per robustezza in caso di tipi eliminati
  S.contratti.forEach(c=>{const t=contrattoTipoObj(c);c.tipoNome=t.nome;c.canone=t.canone;});
  // assicuro la presenza del tipo "Recupero ambientale R10" anche su installazioni esistenti
  if(Array.isArray(S.contrattoTipi)&&!S.contrattoTipi.some(t=>t.id==='recupero_r10')){
    const r10={id:'recupero_r10',nome:'Recupero ambientale R10',canone:false,r10:true};
    const idx=S.contrattoTipi.findIndex(t=>t.id==='fornitura');
    if(idx>-1)S.contrattoTipi.splice(idx+1,0,r10);else S.contrattoTipi.unshift(r10);
  }
  if(!Array.isArray(S.compilatori)) S.compilatori=[];
  if(!Array.isArray(S.sicurezza)) S.sicurezza=[];
  if(!Array.isArray(S.docamm)) S.docamm=[];
  if(!Array.isArray(S.contrattiRA)) S.contrattiRA=[];
  if(!Array.isArray(S.primaNota)) S.primaNota=[];
  if(!Array.isArray(S.fattureEl)) S.fattureEl=[];
  if(!Array.isArray(S.conferimenti)) S.conferimenti=[];
  if(!Array.isArray(S.appLog)) S.appLog=[];
  if(!Array.isArray(S.pnCategorie)||S.pnCategorie.length===0) S.pnCategorie=[...PN_CATEGORIE_DEF];
  [{nome:'Tonnellate',kgPerUnit:1000},{nome:'Metri cubi',kgPerUnit:''}].forEach(o=>{if(!(S.unitaMisura||[]).some(u=>String(u.nome).toLowerCase()===o.nome.toLowerCase()))S.unitaMisura.push({id:uid(),...o});});
  if(!S.counters.contrattoRA) S.counters.contrattoRA={};
  // numerazione progressiva per i contratti R.A. creati prima
  S.contrattiRA.forEach(r=>{
    if(!r.anno) r.anno=r.data?yearOf(r.data):new Date().getFullYear();
    if(r.numero===''||r.numero==null||isNaN(parseInt(r.numero))){const n=(S.counters.contrattoRA[r.anno]||0)+1;r.numero=n;S.counters.contrattoRA[r.anno]=n;}
    else commitNumber('contrattoRA',r.anno,parseInt(r.numero));
  });
  if(!Array.isArray(S.scadenze)) S.scadenze=[];
  if(!Array.isArray(S.scadCategorie)||S.scadCategorie.length===0) S.scadCategorie=[...SCAD_CATEGORIE_DEF];
  if(!Array.isArray(S.sicCategorie)||S.sicCategorie.length===0) S.sicCategorie=[...SIC_CATEGORIE_DEF];
  if(S.azienda){ if((S.azienda.stabilimento||'').includes('22.800')) S.azienda.stabilimento=S.azienda.stabilimento.replace('22.800','22,500'); if(!S.azienda.cellulare) S.azienda.cellulare='338/6673147'; }
  if(!S.settings) S.settings={theme:'light'};
  ensureAziendaCliente();
  ensureConferimentoMateriale();
  // mezzi: unifico la proprietà su un cliente (Cava = cliente azienda)
  const aziendaCid=aziendaClienteId();
  (S.mezzi||[]).forEach(m=>{
    if(m.clienteId){if(!m.proprieta){const c=clienteById(m.clienteId);m.proprieta=(c&&c.isAzienda)?'cava':'cliente';}return;}
    if(m.proprieta==='cava'){m.clienteId=aziendaCid;return;}
    if(m.dittaNome||m.dittaPiva){
      let c=m.dittaPiva?S.clienti.find(x=>x.partitaIva===m.dittaPiva):null;
      if(!c&&m.dittaNome)c=S.clienti.find(x=>x.ragioneSociale===m.dittaNome);
      if(!c){c={id:uid(),ragioneSociale:m.dittaNome||'Ditta',partitaIva:m.dittaPiva||'',codiceFiscale:m.dittaCf||'',indirizzo:m.dittaSede||''};S.clienti.push(c);}
      m.clienteId=c.id;m.proprieta='cliente';
    }else{m.clienteId=aziendaCid;m.proprieta='cava';}
  });
  ANAG_SORT.forEach(k=>{(S[k]||[]).forEach(x=>{if(x._seq!=null&&x._seq>seqCounter)seqCounter=x._seq;});});
  normalizeAnagrafiche();
  await attMigrateLegacy();
  if(!data) await persist();
}
async function persist(){
  normalizeAnagrafiche();
  S._updatedAt=Date.now();
  const ok=await Store.set(KEY,S);
  updateFoot();
  if(ok===false)toast('Attenzione: salvataggio non riuscito, spazio esaurito. Alleggerisci gli allegati.');
  if(SB_ON())sbPushSoon(); else syncPushSoon();
  return ok;
}
const ANAG_SORT=['clienti','destinazioni','materiali','unitaMisura','mezzi','causali','compilatori','modalitaPagamento','aspetti'];
let seqCounter=0;
/* Ordina alfabeticamente le anagrafiche (così anche tutti i menu a tendina sono in ordine)
   e assegna un indice di inserimento _seq per la vista "ultimo inserimento". */
function normalizeAnagrafiche(){
  ANAG_SORT.forEach(k=>{
    const arr=S[k];if(!Array.isArray(arr))return;
    arr.forEach(x=>{if(x._seq==null)x._seq=++seqCounter;else if(x._seq>seqCounter)seqCounter=x._seq;});
    const key=SORT_KEYS[k]||(x=>'');
    arr.sort((a,b)=>collator.compare(String(key(a)||''),String(key(b)||'')));
  });
}
function updateFoot(){
  const el=document.getElementById('foot-info');if(!el)return;
  if(typeof SB_ON!=='undefined'&&SB_ON()){el.innerHTML=sbBadge();return;}

function validaPivaIt(piva){
  const s=String(piva||'').replace(/\s/g,'');
  if(!/^\d{11}$/.test(s))return false;
  let x=0;for(let i=0;i<11;i++){let n=+s[i];if(i%2){n*=2;if(n>9)n-=9;}x+=n;}
  return x%10===0;
}
function validaCap(cap){const s=String(cap||'').trim();return s===''||/^\d{5}$/.test(s);}
function validaEmail(e){const s=String(e||'').trim();return s===''||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);}
function clienteValida(d){
  if(!validaCap(d.cap))return 'CAP non valido (5 cifre)';
  if(!validaEmail(d.email))return 'Email non valida';
  if(d.pec&&!validaEmail(d.pec))return 'PEC non valida';
  return null;
}
function clienteWarn(d){
  const piva=String(d.partitaIva||'').trim();
  if(piva&&!validaPivaIt(piva))return 'Cliente salvato. Nota: la partita IVA non supera il controllo di validità — verifica che sia corretta (per clienti esteri è normale).';
  return null;
}

    ok('Numerazione: nuovo anno 2027 = 1', nextNumber('ddt',2027).numero===1);
    releaseNumber('ddt',[{anno:2026,numero:1}],{anno:2026,numero:2});
    ok('Numerazione: release ultimo -> 2', nextNumber('ddt',2026).numero===2);
    // prezzi

    ok('Cava: nessun listino cliente', addMaterialeToClienteListino('cava','m3',5)===false);

    ok('U.M. a listino elencate', materialeUMs('m1',{}).length===2);
    ok('Esistenza prezzo per U.M.', prezzoUMEsiste('m1','Tonnellate',{})===true && prezzoUMEsiste('m1','Quintali',{})===false);
    // prezzi legati al contratto
    const lc2=S.listini.find(l=>l.tipo==='cliente');

    ensureConferimentoMateriale();

    // periodi nolo / locazione

    ok('Periodo mensile gen-mar = 3', periodoQta('mensile','2026-01-10','2026-03-09')===3);
    ok('Periodo forfettario = 1', periodoQta('forfettario','2026-01-01','2026-12-31')===1);
    // fatture con più contratti
    ok('Fattura: elenco contratti multipli', fatturaContrattiOf({contrattoIds:['a','b']}).length===2 && fatturaContrattiOf({contrattoId:'a'}).length===1);
    // scadenze
    ok('Scadenza ricorrente annuale avanza di un anno', scadProssima('2026-03-15','annuale')==='2027-03-15');
    ok('Scadenza evasa in fondo', scadStato({evasa:true}).ord===9);
    ok('Scadenza passata segnalata', scadStato({dataScadenza:'2000-01-01'}).ord===0);
    // protezione eliminazioni
    S.ddt.push({id:'d1',clienteId:'x',anno:2026,numero:1,righe:[{materialeId:'m1',um:'Tonnellate'}]});
    ok('Blocco eliminazione cliente usato', entityUsage('clienti','x').length>0);
    ok('Nessun blocco per cliente non usato', entityUsage('clienti','cava').length===0);
    // scadenzario unificato
    S.fatture.push({id:'f1',numero:1,anno:2026,clienteId:'x',scadenza:'2026-01-31',totale:100});
    S.scadenze.push({id:'s1',descrizione:'Bollo',dataScadenza:'2026-02-10'});

  }catch(e){res.push({n:'Eccezione: '+e.message,pass:false});}

}

/* ---- Motore prezzi / listini ---- */
function resolveListino(ctx){
  ctx=ctx||{};const L=S.listini;
  if(ctx.contrattoId){ const c=S.contratti.find(x=>x.id===ctx.contrattoId); if(c&&c.listinoId){ const l=L.find(x=>x.id===c.listinoId); if(l) return l; } }
  if(ctx.clienteId&&ctx.destinazioneId){ const l=L.find(x=>x.tipo==='cliente'&&x.clienteId===ctx.clienteId&&x.destinazioneId===ctx.destinazioneId); if(l) return l; }
  if(ctx.clienteId){ const l=L.find(x=>x.tipo==='cliente'&&x.clienteId===ctx.clienteId&&!x.destinazioneId); if(l) return l; }
  return L.find(x=>x.tipo==='default')||null;
}
function prezzoMateriale(materialeId,ctx,um){
  ctx=ctx||{};
  // prezzo specifico per contratto nel listino del cliente
  if(ctx.contrattoId&&ctx.clienteId){
    const lc=S.listini.find(l=>l.tipo==='cliente'&&l.clienteId===ctx.clienteId&&!l.destinazioneId);
    const cand=lc?(lc.voci||[]).filter(v=>v.materialeId===materialeId&&v.contrattoId===ctx.contrattoId):[];
    let v=um?cand.find(x=>(x.um||'')===um):null;if(!v)v=cand[0];
    if(v&&v.prezzo!==''&&v.prezzo!=null)return num(v.prezzo);
  }
  const l=resolveListino(ctx);
  if(l){
    const voci=(l.voci||[]).filter(v=>v.materialeId===materialeId&&!v.contrattoId);
    let v=um?voci.find(v=>(v.um||'')===um):null;
    if(!v)v=voci.find(v=>!v.um)||voci[0];
    if(v&&v.prezzo!==''&&v.prezzo!=null) return num(v.prezzo);
  }
  const m=matById(materialeId); return m?num(m.prezzoUnitario):0;
}
/* Unità di misura per cui esiste un prezzo dedicato del materiale nel listino applicabile */
function materialeUMs(materialeId,ctx){
  const l=resolveListino(ctx);const out=[];
  if(l)(l.voci||[]).filter(v=>v.materialeId===materialeId&&v.um).forEach(v=>{if(!out.includes(v.um))out.push(v.um);});
  return out;
}

function barChartSVG(data,{eur:isEur=false,h=150,color='var(--accent)'}={}){
  const max=Math.max(1,...data.map(d=>d.v));
  const n=data.length,gap=8,W=Math.max(320,n*46),bw=(W-(n-1)*gap)/n,base=h-22;
  const bars=data.map((d,i)=>{const bh=Math.max(1,(d.v/max)*(base-6));const x=i*(bw+gap);const y=base-bh;
    return `<g><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${color}"><title>${esc(d.l)}: ${isEur?'€ '+eur(d.v):qty(d.v)}</title></rect>
      <text x="${x+bw/2}" y="${base+13}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(d.l)}</text></g>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px;overflow:visible">${bars}</svg>`;
}
function hBars(data,{isEur=true}={}){
  const max=Math.max(1,...data.map(d=>d.v));
  return `<div style="display:flex;flex-direction:column;gap:8px">${data.map(d=>`
    <div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span class="strong" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%">${esc(d.l)}</span><span class="sub">${isEur?'€ '+eur(d.v):qty(d.v)}</span></div>
    <div style="height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden"><div style="height:100%;width:${Math.round(d.v/max*100)}%;background:var(--accent);border-radius:5px"></div></div></div>`).join('')}</div>`;
}
/* Raccoglie in un unico elenco tutte le scadenze del gestionale */
function scadenzeUnificate(limiteGiorni){
  const oggi=new Date(today());const out=[];
  const gg=d=>Math.round((new Date(d)-oggi)/86400000);
  S.fatture.filter(f=>f.scadenza&&!f.incassata).forEach(f=>out.push({tipo:'Fattura',pill:'accent',titolo:`Fattura ${f.numero}/${f.anno}`,sotto:clienteName(f.clienteId)||'',
    data:f.scadenza,gg:gg(f.scadenza),importo:num(f.totale),azione:`printFattura('${f.id}')`}));
  (S.scadenze||[]).filter(s=>!s.evasa&&s.dataScadenza).forEach(s=>out.push({tipo:s.categoria||'Scadenza',pill:'warn',titolo:s.descrizione||'Scadenza',sotto:s.riferimento||'',
    data:s.dataScadenza,gg:gg(s.dataScadenza),importo:num(s.importo),azione:`go('scadenze')`}));
  (S.sicurezza||[]).filter(x=>x.validoAl).forEach(x=>out.push({tipo:'Sicurezza',pill:'ok',titolo:x.categoria||'Documento',sotto:x.descrizione||x.responsabile||'',
    data:x.validoAl,gg:gg(x.validoAl),importo:0,azione:`go('sicurezza')`}));
  (S.contratti||[]).filter(c=>c.dataFine).forEach(c=>out.push({tipo:'Contratto',pill:'grey',titolo:`Contratto ${contrattoNum(c)}`,sotto:clienteName(c.clienteId)||'',
    data:c.dataFine,gg:gg(c.dataFine),importo:0,azione:`go('contratti')`}));
  const lim=limiteGiorni==null?null:limiteGiorni;
  return out.filter(v=>lim==null||v.gg<=lim).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
}
function goFatture(stato){filtri.fatture.stato=stato||'';filtri.fatture.anno='';searchTerm.fatture='';go('fatture');}

function dataEstesa(){try{const s=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1);}catch(e){return dmy(today());}}

  const stat=(ico,k,v,opt)=>{opt=opt||{};return `<div class="stat${opt.tone?' '+opt.tone:''}"${opt.onclick?` onclick="${opt.onclick}" style="cursor:pointer"`:''}><div class="k">${svg(IC[ico])}${k}</div><div class="v">${v}</div>${opt.sub||''}</div>`;};
  const rDDT=[...S.ddt].sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,6);
  const rFatt=[...S.fatture].sort((a,b)=>(b.data||'').localeCompare(a.data||'')||b.numero-a.numero).slice(0,6);
  // Fatturato per mese (ultimi 12 mesi) + mese corrente vs precedente
  const mesi=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const now=new Date();const perMese=[];const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const key=ym(d);
    const tot=S.fatture.filter(f=>String(f.data||'').slice(0,7)===key).reduce((s,f)=>s+num(f.totale),0);
    perMese.push({l:mesi[d.getMonth()]+(d.getMonth()===0?" '"+String(d.getFullYear()).slice(2):''),v:round2(tot)});}
  const revMese=S.fatture.filter(f=>String(f.data||'').slice(0,7)===ym(now)).reduce((s,f)=>s+num(f.totale),0);
  const revPrev=S.fatture.filter(f=>String(f.data||'').slice(0,7)===ym(new Date(now.getFullYear(),now.getMonth()-1,1))).reduce((s,f)=>s+num(f.totale),0);
  const delta=revPrev>0?Math.round((revMese-revPrev)/revPrev*100):(revMese>0?100:0);
  const deltaTxt=(revPrev>0||revMese>0)?`<div class="stat-sub ${revMese>=revPrev?'up':'down'}">${revMese>=revPrev?'▲':'▼'} ${Math.abs(delta)}% vs mese prec.</div>`:'';
  // Top clienti / materiali
  const perCli={};fattY.forEach(f=>{perCli[f.clienteId]=(perCli[f.clienteId]||0)+num(f.totale);});
  const topCli=Object.entries(perCli).map(([id,v])=>({l:clienteName(id),v})).sort((a,b)=>b.v-a.v).slice(0,5);
  const perMat={};S.ddt.filter(x=>x.anno===y).forEach(d=>(d.righe||[]).forEach(r=>{if(r.materialeId)perMat[r.materialeId]=(perMat[r.materialeId]||0)+num(r.quantita);}));
  const topMat=Object.entries(perMat).map(([id,v])=>({l:(matById(id)||{}).descrizione||'—',v})).sort((a,b)=>b.v-a.v).slice(0,5);
  // Scadenzario unico
  const voci=scadenzeUnificate();
  const scadute=voci.filter(v=>v.gg<0);
  const prossime=voci.filter(v=>v.gg>=0&&v.gg<=30);
  const oggi7=voci.filter(v=>v.gg>=0&&v.gg<=7).length;
  const totScadute=scadute.filter(v=>v.tipo==='Fattura').reduce((s,x)=>s+num(x.importo),0);
  const az=(S.azienda&&S.azienda.ragioneSociale)||'';
  c.innerHTML=`
    <div class="dash-hi">
      <div><div class="dash-hello">${salutoOrario()}${az?` · <span class="dash-az">${esc(az)}</span>`:''}</div>
        <div class="dash-date">${dataEstesa()}</div></div>
      <div class="dash-chips">
        ${scadute.length?`<button class="dash-chip danger" onclick="go('scadenze')">${scadute.length} scadute</button>`:''}
        ${oggi7?`<button class="dash-chip warn" onclick="go('scadenze')">${oggi7} entro 7 gg</button>`:''}
        ${daFatt?`<button class="dash-chip" onclick="go('ddt')">${daFatt} DDT da fatturare</button>`:''}
        ${(!scadute.length&&!oggi7&&!daFatt)?`<span class="dash-chip ok">${svg(IC.check,1.8)} Tutto in ordine</span>`:''}
      </div>
    </div>
    <div class="stat-grid six">
      ${stat('doc','DDT '+y,ddtY,{onclick:"go('ddt')"})}
      ${stat('invoice','Fatture '+y,fattY.length,{onclick:"go('fatture')"})}
      ${stat('invoice','Fatturato '+y+' (€)',eur(fatturato),{onclick:"go('fatture')"})}
      ${stat('invoice','Fatturato del mese (€)',eur(revMese),{onclick:"go('fatture')",sub:deltaTxt})}
      ${stat('card','Da incassare (€)',eur(daIncassare),{onclick:"goFatture('dainc')"})}

    </div>
    <div class="quick">
      <button class="btn primary" onclick="openDDTForm()">${svg(IC.plus)} Nuovo DDT</button>

      releaseNumber('contratto',S.contratti,removed);

    }

let searchTerm={};
const SORT_KEYS={
  clienti:x=>x.ragioneSociale,
  destinazioni:x=>[x.indirizzo,x.citta].filter(Boolean).join(' '),
  materiali:x=>x.descrizione,
  unitaMisura:x=>x.nome,
  mezzi:x=>x.targa,
  causali:x=>x.descrizione,
  compilatori:x=>x.nome,
  modalitaPagamento:x=>x.nome,
  aspetti:x=>x.descrizione,
};
const ordina={};            // entity -> 'az' | 'recenti'
const grupCliente={};       // entity -> bool
let contrattiRaggruppa=false;
let listiniRaggruppa=false;
const collator=new Intl.Collator('it',{sensitivity:'base',numeric:true});
function entityRowHtml(entity,cfg,x){
  return `<tr>${cfg.columns.map(col=>`<td class="${col.cls||''}">${col.v(x)}</td>`).join('')}
    <td class="actions">
      ${cfg.rowActions?cfg.rowActions(x):''}
      <button class="icon-btn sm" title="Modifica" onclick="openEntity('${entity}','${x.id}')">${svg(IC.edit,1.9)}</button>
      <button class="icon-btn sm danger" title="Elimina" onclick="delEntity('${entity}','${x.id}')">${svg(IC.trash,1.9)}</button>
    </td></tr>`;
}
function renderEntity(entity,c){
  const cfg=ENTITIES[entity];
  setActions(`${cfg.extraActions?cfg.extraActions():''}<button class="btn primary" onclick="openEntity('${entity}')">${svg(IC.plus)} Nuovo ${cfg.singular.toLowerCase()}</button>`);
  if(entity==='contratti')return renderContrattiList(cfg,c);
  const canGroup=!!cfg.groupByCliente;
  const grouped=canGroup&&grupCliente[entity];
  let rows=cfg.list();
  const term=(searchTerm[entity]||'').toLowerCase().trim();
  if(term) rows=rows.filter(x=>cfg.search(x).toLowerCase().includes(term));
  const mode=ordina[entity]||'az';
  const key=SORT_KEYS[entity]||(x=>cfg.search(x));
  const sortFn=mode==='recenti'?(a,b)=>(b._seq||0)-(a._seq||0):(a,b)=>collator.compare(String(key(a)||''),String(key(b)||''));
  const nCols=cfg.columns.length+1;
  let bodyHtml;
  if(grouped){
    const groups={};rows.forEach(x=>{(groups[x.clienteId||'']=groups[x.clienteId||'']||[]).push(x);});
    const cids=Object.keys(groups).sort((a,b)=>collator.compare(a?clienteName(a)||'—':'zzzz',b?clienteName(b)||'—':'zzzz'));
    bodyHtml=cids.map(cid=>{const lista=groups[cid].sort(sortFn);
      return `<tr class="grp"><td colspan="${nCols}">${svg(IC.user,1.8)} ${esc(cid?clienteName(cid)||'—':'— senza cliente collegato —')} <span class="sub">(${lista.length})</span></td></tr>`
        +lista.map(x=>entityRowHtml(entity,cfg,x)).join('');}).join('');
  }else bodyHtml=[...rows].sort(sortFn).map(x=>entityRowHtml(entity,cfg,x)).join('');
  c.innerHTML=`
    <div class="toolbar">
      <div class="search">${svg(IC.search)}<input placeholder="Cerca…" value="${esc(searchTerm[entity]||'')}" data-sf="${entity}" oninput="searchTerm['${entity}']=this.value;render()"></div>
      <select onchange="ordina['${entity}']=this.value;render()" title="Ordinamento">
        <option value="az" ${mode==='az'?'selected':''}>Ordine alfabetico (A → Z)</option>
        <option value="recenti" ${mode==='recenti'?'selected':''}>Ultimo inserimento</option>
      </select>
      ${canGroup?`<button class="btn ${grouped?'primary':''}" onclick="grupCliente['${entity}']=!grupCliente['${entity}'];render()">${svg(IC.user)} ${grouped?'Raggruppati per cliente':'Raggruppa per cliente'}</button>`:''}
    </div>
    <div class="card">
      ${cfg.list().length===0
        ? emptyState(cfg.icon,`Nessun elemento`,`Aggiungi il primo elemento all'anagrafica.`,`<button class="btn primary" onclick="openEntity('${entity}')">${svg(IC.plus)} Aggiungi</button>`)
        : rows.length===0 ? emptyState('search','Nessun risultato','Prova con un altro termine.')
        : `<table><thead><tr>${cfg.columns.map(col=>`<th class="${col.cls||''}">${col.h}</th>`).join('')}<th></th></tr></thead>
          <tbody>${bodyHtml}</tbody></table>`}
    </div>`;
}
function renderContrattiList(cfg,c){
  let rows=cfg.list().filter(x=>!contrattoIsR10(x)); // i recupero ambientale (R10) sono gestiti in "Editing contratti R.A."
  const term=(searchTerm.contratti||'').toLowerCase().trim();
  if(term) rows=rows.filter(x=>cfg.search(x).toLowerCase().includes(term));
  const numCmp=(a,b)=>(b.anno-a.anno)||(b.numero-a.numero); // numerico, più recente in alto
  const nCols=cfg.columns.length+1;
  let bodyHtml;
  if(contrattiRaggruppa){
    const gruppi={};
    rows.forEach(x=>{(gruppi[x.clienteId||'']=gruppi[x.clienteId||'']||[]).push(x);});
    const clientiOrdinati=Object.keys(gruppi).sort((a,b)=>collator.compare(clienteName(a)||'—',clienteName(b)||'—'));
    bodyHtml=clientiOrdinati.map(cid=>{
      const lista=gruppi[cid].sort(numCmp);
      return `<tr class="grp"><td colspan="${nCols}">${svg(IC.user,1.8)} ${esc(clienteName(cid)||'— senza cliente —')} <span class="sub">(${lista.length})</span></td></tr>`
        +lista.map(x=>entityRowHtml('contratti',cfg,x)).join('');
    }).join('');
  }else{
    bodyHtml=[...rows].sort(numCmp).map(x=>entityRowHtml('contratti',cfg,x)).join('');
  }
  c.innerHTML=`
    <div class="toolbar">
      <div class="search">${svg(IC.search)}<input placeholder="Cerca per numero, cliente, oggetto…" value="${esc(searchTerm.contratti||'')}" data-sf="contratti" oninput="searchTerm.contratti=this.value;render()"></div>
      <button class="btn ${contrattiRaggruppa?'primary':''}" onclick="contrattiRaggruppa=!contrattiRaggruppa;render()">${svg(IC.user)} ${contrattiRaggruppa?'Raggruppati per cliente':'Raggruppa per cliente'}</button>
    </div>
    <div class="card">
      ${cfg.list().length===0

function fieldInput(f,val){
  const v=val!=null?val:(f.def!=null?f.def:'');
  const oc=' onchange="entityToggleFields()"';
  if(f.type==='textarea')return `<textarea data-k="${f.k}">${esc(v)}</textarea>`;
  const objOptions=f.optionsFn?f.optionsFn():f.objOptions;
  if(f.type==='select'&&objOptions){
    const sel=`<select data-k="${f.k}"${f.qa?` id="ent-${f.k}"`:''}${oc}>${objOptions.map(o=>`<option value="${o.value}" ${o.value===v?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    return f.qa?`<div class="with-add">${sel}${qaBtn(`quickAddInto('${f.qa}','ent-${f.k}',{},()=>entityToggleFields())`)}</div>`:sel;
  }
  if(f.type==='select')return `<select data-k="${f.k}"${oc}>${f.options.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
  if(f.type==='um')return `<div class="with-add"><select id="ent-${f.k}" data-k="${f.k}"${oc}>${umOptionsHtml(v)}</select>${qaBtn(`quickAddInto('unitaMisura','ent-${f.k}')`)}</div>`;
  if(f.type==='cliente')return `<div class="with-add"><select id="ent-${f.k}" data-k="${f.k}"${oc}><option value="">— nessuno —</option>${S.clienti.map(c=>`<option value="${c.id}" ${c.id===v?'selected':''}>${esc(c.ragioneSociale)}</option>`).join('')}</select>${qaBtn(`quickAddInto('clienti','ent-${f.k}',{},()=>entityToggleFields())`)}</div>`;
  if(f.type==='listino')return `<select data-k="${f.k}"${oc}><option value="">— nessuno —</option>${S.listini.map(l=>`<option value="${l.id}" ${l.id===v?'selected':''}>${esc(l.nome)}</option>`).join('')}</select>`;
  const t=f.type==='number'?'number':(f.type==='date'?'date':'text');const step=f.type==='number'?' step="any"':'';
  const h=(f.onchange?` onchange="${f.onchange}"`:'')+(f.oninput?` oninput="${f.oninput}"`:'');
  return `<input type="${t}"${step} data-k="${f.k}" value="${esc(v)}"${f.readonly?' readonly':''}${h}>`;
}
function entityToggleFields(){
  const vals={};
  document.querySelectorAll('#modal [data-k]').forEach(el=>{vals[el.dataset.k]=el.value;});
  document.querySelectorAll('#modal [data-showif]').forEach(w=>{
    let cond;try{cond=JSON.parse(w.dataset.showif);}catch(e){return;}
    let vis;
    if('canone' in cond) vis=(contrattoIsCanoneById(vals[cond.k])===cond.canone);
    else if('r10' in cond) vis=(contrattoIsR10ById(vals[cond.k])===cond.r10);
    else if('pagabile' in cond) vis=(contrattoPagabileById(vals[cond.k])===cond.pagabile);
    else vis=(cond.in||[]).includes(vals[cond.k]);
    w.style.display=vis?'':'none';
  });
}
function openEntity(entity,id,preset){
  const cfg=ENTITIES[entity];
  window._entityCtx={entity,id};
  const base=(!id&&cfg.newDefaults)?cfg.newDefaults():{};
  const loaded=id?{...cfg.list().find(x=>x.id===id)}:{...base};
  if(cfg.toForm)Object.assign(loaded,cfg.toForm(loaded));
  const item={...loaded,...(preset||{})};
  const body=`<div class="form-grid">${cfg.fields.map(f=>`
    <div class="field ${f.col2?'col2':''}" ${f.showIf?`data-showif="${esc(JSON.stringify(f.showIf))}"`:''}><label>${f.label}${f.req?' <span class="req">*</span>':''}</label>
    ${fieldInput(f,item[f.k])}${f.hint?`<span class="hint">${f.hint}</span>`:''}</div>`).join('')}</div>`;
  openModal(`${id?'Modifica':'Nuovo'} ${cfg.singular.toLowerCase()}`,body,()=>{
    const data=id?{...item}:{id:uid(),...base};
    document.querySelectorAll('#modal [data-k]').forEach(el=>{let val=el.value;if(el.type==='number')val=val===''?'':num(val);data[el.dataset.k]=val;});
    for(const f of cfg.fields){
      if(f.showIf){
        const hid=('canone' in f.showIf)?(contrattoIsCanoneById(data[f.showIf.k])!==f.showIf.canone)
          :('r10' in f.showIf)?(contrattoIsR10ById(data[f.showIf.k])!==f.showIf.r10)
          :('pagabile' in f.showIf)?(contrattoPagabileById(data[f.showIf.k])!==f.showIf.pagabile)
          :!(f.showIf.in||[]).includes(data[f.showIf.k]);
        if(hid)continue;
      }
      if(f.req&&!String(data[f.k]||'').trim()){toast('Compila: '+f.label);return false;}
    }
    if(cfg.beforeSave&&cfg.beforeSave(data)===false)return false;
    if(id){const i=cfg.list().findIndex(x=>x.id===id);cfg.list()[i]=data;}else cfg.list().push(data);
    if(cfg.afterSave)cfg.afterSave(data);
    logAction(id?cfg.singular+' modificato':cfg.singular+' aggiunto',data.ragioneSociale||data.nome||data.descrizione||data.targa||contrattoNum&&data.numero&&(cfg.singular+' '+data.numero)||'');
    persist();render();toast(cfg.singular+' salvato');return true;
  });
  entityToggleFields();
}

/* Dove è usato un elemento dell'anagrafica: evita eliminazioni che romperebbero i documenti */
function entityUsage(entity,id){
  const it=(ENTITIES[entity].list()||[]).find(x=>x.id===id)||{};
  const u=[];const add=(n,lab,labP)=>{if(n>0)u.push(`${n} ${n===1?lab:(labP||lab)}`);};
  const nome=it.nome||it.descrizione||'';
  const RA=S.contrattiRA||[];
  if(entity==='clienti'){
    add(S.ddt.filter(d=>d.clienteId===id).length,'DDT');
    add(S.fatture.filter(f=>f.clienteId===id).length,'fattura','fatture');
    add(S.contratti.filter(c=>c.clienteId===id).length,'contratto','contratti');
    add(S.listini.filter(l=>l.clienteId===id).length,'listino','listini');
    add(S.mezzi.filter(m=>m.clienteId===id).length,'mezzo','mezzi');
    add(S.destinazioni.filter(d=>d.clienteId===id).length,'destinazione','destinazioni');
    add(RA.filter(r=>r.clienteId===id||r.produttoreClienteId===id).length,'contratto R.A.','contratti R.A.');
  }else if(entity==='destinazioni'){
    add(S.ddt.filter(d=>d.destinazioneId===id).length,'DDT');
    add(S.listini.filter(l=>l.destinazioneId===id).length,'listino','listini');
  }else if(entity==='materiali'){
    add(S.ddt.filter(d=>(d.righe||[]).some(r=>r.materialeId===id)).length,'DDT');
    add(S.contratti.filter(c=>c.materialeId===id).length,'contratto','contratti');
  }else if(entity==='mezzi'){
    add(S.ddt.filter(d=>d.mezzoId===id).length,'DDT');
  }else if(entity==='compilatori'){
    add(S.ddt.filter(d=>d.compilatoreId===id).length,'DDT');
  }else if(entity==='contratti'){
    add(S.ddt.filter(d=>d.contrattoId===id).length,'DDT');
    add(S.fatture.filter(f=>fatturaContrattiOf(f).indexOf(id)>-1).length,'fattura','fatture');
    add(S.listini.filter(l=>(l.voci||[]).some(v=>v.contrattoId===id)).length,'listino','listini');
  }else if(entity==='unitaMisura'){
    add(S.ddt.filter(d=>(d.righe||[]).some(r=>r.um===nome)||((d.trasporto||{}).um===nome)).length,'DDT');
    add(S.fatture.filter(f=>(f.righe||[]).some(r=>r.um===nome)).length,'fattura','fatture');
    add(S.listini.filter(l=>(l.voci||[]).some(v=>v.um===nome)).length,'listino','listini');
    add(S.contratti.filter(c=>c.um===nome).length,'contratto','contratti');
    add(RA.filter(r=>r.umPrezzo===nome||r.umQuantita===nome).length,'contratto R.A.','contratti R.A.');
  }else if(entity==='causali'){
    add(S.ddt.filter(d=>d.causale===nome).length,'DDT');
  }else if(entity==='aspetti'){
    add(S.ddt.filter(d=>d.aspettoBeni===nome).length,'DDT');
  }else if(entity==='modalitaPagamento'){
    add(S.fatture.filter(f=>f.modalitaPagamento===nome).length,'fattura','fatture');
    add(S.listini.filter(l=>l.pagamento===nome).length,'listino','listini');
    add(S.contratti.filter(c=>c.pagamento===nome).length,'contratto','contratti');
    add(RA.filter(r=>r.pagamento===nome).length,'contratto R.A.','contratti R.A.');
  }
  return u;
}
function infoDialog(titolo,html){openModal(titolo,html,()=>true,{submitLabel:'Ho capito'});}
function delEntity(entity,id){
  const cfg=ENTITIES[entity];
  const it=cfg.list().find(x=>x.id===id);
  if(it&&it.isAzienda){toast('È il cliente dell\'azienda (cedente) e non può essere eliminato');return;}
  const usi=entityUsage(entity,id);
  if(usi.length){
    infoDialog('Impossibile eliminare',`<div class="note">${svg(IC.shield)}<div>Questo elemento è collegato a documenti già registrati: eliminarlo li lascerebbe incompleti.</div></div>
      <div style="font-weight:700;margin:4px 0 6px">Attualmente utilizzato in:</div>
      <div class="att-list">${usi.map(t=>`<div class="att"><span class="ic">${svg(IC.doc,1.9)}</span><span style="flex:1">${esc(t)}</span></div>`).join('')}</div>
      <div class="hint" style="margin-top:10px">Puoi comunque modificarlo. Per eliminarlo, aggiorna prima i documenti collegati.</div>`);
    return;
  }
  confirmDialog(`Eliminare questo elemento?`,'L\'operazione non è reversibile.',()=>{
    const arr=cfg.list();const i=arr.findIndex(x=>x.id===id);const removed=i>-1?arr[i]:null;if(i>-1)arr.splice(i,1);
    if(cfg.onDelete)cfg.onDelete(id,removed);
    logAction(cfg.singular+' eliminato',removed?(removed.ragioneSociale||removed.nome||removed.descrizione||removed.targa||''):'');
    persist();render();toast('Elemento eliminato');
  });
}

function openContrattoTipi(onDone){
  const uso=id=>S.contratti.filter(c=>c.tipo===id).length;
  const body=`
    <div class="note">${svg(IC.tag)}<div><b>Prezzi a listino</b>: contratto di fornitura collegato a un listino (come "Fornitura"). <b>Canone a tempo</b>: prezzo e periodicità (come "Nolo"/"Affitto"). Rinominare un tipo aggiorna i contratti collegati.</div></div>
    <div class="lines"><table><thead><tr><th>Tipo</th><th>Comportamento</th><th></th></tr></thead>
      <tbody id="ct-body">${S.contrattoTipi.map(t=>ctipoRow(t)).join('')}</tbody></table></div>
    <div style="margin-top:8px"><button type="button" class="btn sm" onclick="ctipoAdd()">${svg(IC.plus)} Aggiungi tipo</button></div>
    ${S.contratti.length?`<div class="hint" style="margin-top:10px">In uso: ${S.contrattoTipi.filter(t=>uso(t.id)).map(t=>`${esc(t.nome)} (${uso(t.id)})`).join(' · ')||'nessuno'}</div>`:''}`;
  const submit=()=>{
    const rows=[...document.querySelectorAll('#ct-body tr')];
    const list=rows.map(tr=>{const nome=tr.querySelector('.ct-nome').value.trim();if(!nome)return null;
      const id=tr.querySelector('.ct-nome').dataset.id||uid();const prev=(S.contrattoTipi||[]).find(t=>t.id===id);
      const o={id,nome,canone:tr.querySelector('.ct-canone').value==='canone'};if(prev&&prev.r10){o.r10=true;o.canone=false;}return o;}).filter(Boolean);
    if(list.length===0){toast('Serve almeno un tipo');return false;}
    const dup=list.find((t,i)=>list.findIndex(x=>x.nome.toLowerCase()===t.nome.toLowerCase())!==i);
    if(dup){toast('Tipo duplicato: '+dup.nome);return false;}
    S.contrattoTipi=list;
    S.contratti.forEach(c=>{const t=S.contrattoTipi.find(t=>t.id===c.tipo);if(t){c.tipoNome=t.nome;c.canone=t.canone;}});
    persist();toast('Tipi di contratto aggiornati');
    if(onDone)onDone();else render();
    return true;
  };
  if(onDone)openModal2('Tipi di contratto',body,submit,{submitLabel:'Salva tipi'});
  else openModal('Tipi di contratto',body,submit,{submitLabel:'Salva tipi'});
}

    <button class="btn" onclick="openListino()">${svg(IC.plus)} Nuovo listino</button>`);
  const tipoLabel=l=>{ if(l.tipo==='default')return '<span class="pill accent">Predefinito</span>';
    let s='<span class="pill grey">Cliente: '+esc(clienteName(l.clienteId))+'</span>';
    if(l.destinazioneId){const d=S.destinazioni.find(x=>x.id===l.destinazioneId);if(d)s+=' <span class="pill grey">'+esc([d.indirizzo,d.citta].filter(Boolean).join(', '))+'</span>';}
    return s; };
  const matCfg=ENTITIES.materiali;
  const mTerm=(searchTerm.listiniMat||'').toLowerCase().trim();
  let mats=[...S.materiali].sort((a,b)=>collator.compare(String(a.descrizione||''),String(b.descrizione||'')));
  if(mTerm) mats=mats.filter(m=>matCfg.search(m).toLowerCase().includes(mTerm));
  const lTerm=(searchTerm.listiniList||'').toLowerCase().trim();
  const listinoSearch=l=>[l.nome,clienteName(l.clienteId),(S.destinazioni.find(d=>d.id===l.destinazioneId)||{}).indirizzo,(S.destinazioni.find(d=>d.id===l.destinazioneId)||{}).citta].filter(Boolean).join(' ');
  let lists=S.listini.filter(l=>!lTerm||listinoSearch(l).toLowerCase().includes(lTerm));
  const nPrezzi=l=>(l.voci||[]).filter(v=>v.prezzo!==''&&v.prezzo!=null).length;
  const listRow=l=>`<tr>
    <td class="strong">${esc(l.nome)}</td>
    <td>${tipoLabel(l)}</td>
    <td class="sub">${l.pagamento?esc(l.pagamento):'—'}${(l.scadenzaGiorni!==''&&l.scadenzaGiorni!=null)?`<div class="sub">scad. ${l.scadenzaGiorni} gg</div>`:''}</td>
    <td class="sub">${nPrezzi(l)} prezzi</td>
    <td class="actions">
      <button class="icon-btn sm" title="Stampa listino" onclick="stampaListino('${l.id}')">${svg(IC.print,1.9)}</button>
      <button class="icon-btn sm" title="Modifica" onclick="openListino('${l.id}')">${svg(IC.edit,1.9)}</button>
      ${l.tipo==='default'?'':`<button class="icon-btn sm danger" title="Elimina" onclick="delListino('${l.id}')">${svg(IC.trash,1.9)}</button>`}
    </td></tr>`;
  const listSort=(a,b)=>{if(a.tipo==='default')return -1;if(b.tipo==='default')return 1;
    const cn=collator.compare(clienteName(a.clienteId)||'zzzz',clienteName(b.clienteId)||'zzzz');return cn||collator.compare(a.nome||'',b.nome||'');};
  let listBody;
  if(listiniRaggruppa){
    const groups={};lists.forEach(l=>{const gk=l.tipo==='default'?'__def__':(l.clienteId||'');(groups[gk]=groups[gk]||[]).push(l);});
    const gkeys=Object.keys(groups).sort((a,b)=>{if(a==='__def__')return -1;if(b==='__def__')return 1;return collator.compare(a?clienteName(a)||'—':'zzzz',b?clienteName(b)||'—':'zzzz');});
    listBody=gkeys.map(gk=>{const lista=groups[gk].sort((a,b)=>collator.compare(a.nome||'',b.nome||''));
      const label=gk==='__def__'?'Listino predefinito':(gk?clienteName(gk)||'—':'— senza cliente —');
      return `<tr class="grp"><td colspan="5">${svg(IC.user,1.8)} ${esc(label)} <span class="sub">(${lista.length})</span></td></tr>`+lista.map(listRow).join('');}).join('');
  }else listBody=[...lists].sort(listSort).map(listRow).join('');
  c.innerHTML=`
    <div class="note">${svg(IC.list)}<div>Qui crei i <b>materiali</b> con il loro prezzo di listino base. Puoi poi aggiungere listini per un cliente (anche legati a una destinazione) o collegati a un <b>contratto</b>. In DDT/fattura il prezzo viene scelto con priorità: contratto → destinazione → cliente → predefinito.</div></div>
    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><h2>Materiali</h2>
        <div class="search" style="max-width:260px;margin:0 10px">${svg(IC.search)}<input placeholder="Cerca materiale…" value="${esc(searchTerm.listiniMat||'')}" data-sf="listiniMat" oninput="searchTerm.listiniMat=this.value;render()"></div>
        <div style="flex:1"></div>
        <button class="btn sm primary" onclick="openEntity('materiali')">${svg(IC.plus)} Nuovo materiale</button></div>
      ${S.materiali.length===0
        ? emptyState('box','Nessun materiale','Crea il primo materiale: descrizione, unità di misura e prezzo del listino base.',`<button class="btn primary" onclick="openEntity('materiali')">${svg(IC.plus)} Nuovo materiale</button>`)
        : mats.length===0 ? emptyState('search','Nessun materiale trovato','Prova con un altro termine.')
        : `<table><thead><tr>${matCfg.columns.map(col=>`<th class="${col.cls||''}">${col.h}</th>`).join('')}<th></th></tr></thead>
          <tbody>${mats.map(x=>`<tr>${matCfg.columns.map(col=>`<td class="${col.cls||''}">${col.v(x)}</td>`).join('')}
            <td class="actions">
              <button class="icon-btn sm" title="Modifica" onclick="openEntity('materiali','${x.id}')">${svg(IC.edit,1.9)}</button>
              <button class="icon-btn sm danger" title="Elimina" onclick="delEntity('materiali','${x.id}')">${svg(IC.trash,1.9)}</button>
            </td></tr>`).join('')}</tbody></table>`}
    </div>
    <div class="card">
      <div class="card-head"><h2>Listini prezzi</h2>
        <div class="search" style="max-width:260px;margin:0 10px">${svg(IC.search)}<input placeholder="Cerca per cliente, nome…" value="${esc(searchTerm.listiniList||'')}" data-sf="listiniList" oninput="searchTerm.listiniList=this.value;render()"></div>
        <div style="flex:1"></div>
        <button class="btn sm ${listiniRaggruppa?'primary':''}" onclick="listiniRaggruppa=!listiniRaggruppa;render()">${svg(IC.user)} ${listiniRaggruppa?'Raggruppati':'Raggruppa per cliente'}</button>
        <button class="btn sm" onclick="openListino()">${svg(IC.plus)} Nuovo listino</button></div>
      ${S.listini.length===0?emptyState('list','Nessun listino','Crea il primo listino.'):
        lists.length===0?emptyState('search','Nessun listino trovato','Prova con un altro termine.'):
      `<table><thead><tr><th>Listino</th><th>Ambito</th><th>Pagamento</th><th>Voci</th><th></th></tr></thead><tbody>${listBody}</tbody></table>`}
    </div>`;
}
function delListino(id){
  confirmDialog('Eliminare questo listino?','I contratti collegati resteranno senza listino.',()=>{
    S.listini=S.listini.filter(x=>x.id!==id);
    S.contratti.forEach(c=>{if(c.listinoId===id)c.listinoId='';});
    persist();render();toast('Listino eliminato');
  });
}
function listinoNuovoMateriale(){
  quickAdd('materiali',{},rec=>{
    const body=document.getElementById('lz-mat-body');if(!body)return;
    body.insertAdjacentHTML('beforeend',lzRowHtml({materialeId:rec.id,um:rec.um||'',prezzo:rec.prezzoUnitario}));
  });
}
let lzShowContratto=false;
function lzMatOptions(mid){return `<option value="">— materiale —</option>`+S.materiali.map(m=>`<option value="${m.id}" ${m.id===mid?'selected':''}>${esc(m.descrizione)}</option>`).join('');}
function lzUmOptions(sel){return `<option value="">(qualsiasi U.M.)</option>`+S.unitaMisura.map(u=>`<option value="${esc(u.nome)}" ${u.nome===sel?'selected':''}>${esc(u.nome)}</option>`).join('');}
function lzContrattoOptions(sel){
  return `<option value="">(nessun contratto)</option>`+[...S.contratti]
    .sort((a,b)=>collator.compare(clienteName(a.clienteId)||'',clienteName(b.clienteId)||'')||(b.anno-a.anno)||(b.numero-a.numero))
    .map(ct=>`<option value="${ct.id}" ${ct.id===sel?'selected':''}>${esc(contrattoNum(ct))} · ${esc(clienteName(ct.clienteId)||'—')} · ${esc(contrattoTipoNome(ct))}</option>`).join('');
}
function lzRowContratto(sel){
  const tr=sel.closest('tr');const c=S.contratti.find(x=>x.id===sel.value);const um=tr.querySelector('.lz-um');
  if(c&&c.um){if(![...um.options].some(o=>o.value===c.um)){const o=document.createElement('option');o.value=c.um;o.textContent=c.um;um.appendChild(o);}um.value=c.um;}
}
function lzRowHtml(v){v=v||{};return `<tr>
  <td><select class="lz-mat">${lzMatOptions(v.materialeId||'')}</select></td>
  <td style="width:140px"><select class="lz-um">${lzUmOptions(v.um||'')}</select></td>
  ${lzShowContratto?`<td style="width:220px"><select class="lz-contr" onchange="lzRowContratto(this)">${lzContrattoOptions(v.contrattoId||'')}</select></td>`:''}
  <td style="width:110px"><input class="lz-prz" type="number" step="any" value="${v.prezzo!==''&&v.prezzo!=null?v.prezzo:''}" placeholder="0,00"></td>
  <td style="width:34px"><button type="button" class="rm" onclick="this.closest('tr').remove()">${svg(IC.trash,2)}</button></td>
</tr>`;}
function listinoAddRow(){document.getElementById('lz-mat-body').insertAdjacentHTML('beforeend',lzRowHtml({}));}
function openListino(id,preset,onSaved){
  preset=(typeof preset==='string')?{clienteId:preset}:(preset||{});
  const l=id?{...S.listini.find(x=>x.id===id)}:{tipo:'cliente',voci:[],clienteId:preset.clienteId||'',nome:preset.nome||''};
  const isDefault=l.tipo==='default';
  lzShowContratto=!isDefault;
  let initVoci=(l.voci||[]).slice();
  if(isDefault)S.materiali.forEach(m=>{if(!initVoci.some(v=>v.materialeId===m.id))initVoci.push({materialeId:m.id,um:'',prezzo:''});});
  initVoci.sort((a,b)=>collator.compare(String((matById(a.materialeId)||{}).descrizione||''),String((matById(b.materialeId)||{}).descrizione||'')));
  const matRows=initVoci.length?initVoci.map(v=>lzRowHtml(v)).join(''):lzRowHtml({});
  const clienteOpts=`<option value="">— seleziona —</option>`+S.clienti.map(c=>`<option value="${c.id}" ${l.clienteId===c.id?'selected':''}>${esc(c.ragioneSociale)}</option>`).join('');
  const pagOpts=`<option value="">— nessuna —</option>`+S.modalitaPagamento.map(p=>`<option ${l.pagamento===p.nome?'selected':''}>${esc(p.nome)}</option>`).join('');
  const body=`
    <div class="form-grid">
      <div class="field col2"><label>Nome listino <span class="req">*</span></label><input id="lz-nome" value="${esc(l.nome||'')}" ${isDefault?'':''} placeholder="Es. Listino cantiere Roma Est"></div>
      ${isDefault?`<div class="field col2"><span class="pill accent">Listino predefinito</span></div>`:`
      <div class="field"><label>Cliente</label><div class="with-add"><select id="lz-cliente" onchange="listinoRefreshDest()">${clienteOpts}</select>${qaBtn("quickAddInto('clienti','lz-cliente',{},()=>listinoRefreshDest())")}</div></div>
      <div class="field"><label>Destinazione (facoltativa)</label><div class="with-add"><select id="lz-dest"><option value="">— tutte —</option></select>${qaBtn("quickAdd('destinazioni',{clienteId:(document.getElementById('lz-cliente')||{}).value},r=>{listinoRefreshDest(r.id);})")}</div></div>`}
      <div class="section-label">Condizioni di pagamento</div>
      <div class="field"><label>Modalità di pagamento</label><div class="with-add"><select id="lz-pag">${pagOpts}</select>${qaBtn("quickAddInto('modalitaPagamento','lz-pag')")}</div>
        <span class="hint">Dall'anagrafica Modalità di pagamento.</span></div>
      <div class="field"><label>Scadenza (giorni dalla data fattura)</label>
        <input id="lz-scad" type="number" step="1" min="0" value="${l.scadenzaGiorni!=null&&l.scadenzaGiorni!==''?l.scadenzaGiorni:''}" placeholder="Es. 30">
        <span class="hint">In fattura vengono proposte in automatico; restano modificabili.</span></div>
      <div class="section-label">Prezzi per materiale e unità di misura</div>
      <div class="field col2" style="grid-column:span 2">
        <div class="lines"><table><thead><tr><th>Materiale</th><th>Unità di misura</th>${isDefault?'':'<th>Contratto (rif.)</th>'}<th>Prezzo €</th><th></th></tr></thead><tbody id="lz-mat-body">${matRows}</tbody></table></div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn sm" onclick="listinoAddRow()">${svg(IC.plus)} Aggiungi prezzo</button>
          <button type="button" class="btn sm" onclick="listinoNuovoMateriale()">${svg(IC.plus)} Nuovo materiale</button></div>
        <span class="hint">Un materiale può avere più prezzi, uno per unità di misura. ${isDefault?'':'Puoi legare un prezzo a un <b>contratto</b> per distinguerlo (l&rsquo;U.M. si allinea a quella del contratto). '}Scegli «(qualsiasi U.M.)» per il prezzo valido quando non c'è quello specifico. Un materiale nuovo viene aggiunto anche al listino base.</span>
      </div>
    </div>`;
  openModal(`${id?'Modifica':'Nuovo'} listino`,body,()=>{
    const nome=document.getElementById('lz-nome').value.trim();
    if(!nome){toast('Dai un nome al listino');return false;}
    const voci=[...document.querySelectorAll('#lz-mat-body tr')].map(tr=>{
      const mid=tr.querySelector('.lz-mat').value;const um=tr.querySelector('.lz-um').value;const pv=tr.querySelector('.lz-prz').value;
      const contr=tr.querySelector('.lz-contr');
      return {materialeId:mid,um:um||'',contrattoId:contr?contr.value||'':'',prezzo:pv===''?'':num(pv)};
    }).filter(v=>v.materialeId&&v.prezzo!==''&&v.prezzo!=null);
    const scad=document.getElementById('lz-scad').value;
    const data={id:l.id||uid(),nome,tipo:l.tipo, voci,
      pagamento:document.getElementById('lz-pag').value||'',
      scadenzaGiorni:scad===''?'':Math.max(0,parseInt(scad)||0)};
    if(isDefault){ S.materiali.forEach(m=>{const vs=voci.filter(v=>v.materialeId===m.id);const gen=vs.find(v=>!v.um)||vs[0];m.prezzoUnitario=gen?gen.prezzo:'';}); }
    if(!isDefault){ data.clienteId=document.getElementById('lz-cliente').value||''; data.destinazioneId=document.getElementById('lz-dest').value||''; }
    if(id){const i=S.listini.findIndex(x=>x.id===id);S.listini[i]=data;}else S.listini.push(data);
    persist();render();toast('Listino salvato');
    if(onSaved)setTimeout(()=>onSaved(data.id),0);
    return true;
  },{wide:true,submitLabel:'Salva listino'});
  if(!isDefault) listinoRefreshDest(l.destinazioneId);
}
function listinoRefreshDest(selId){
  const cSel=document.getElementById('lz-cliente'),dSel=document.getElementById('lz-dest');if(!dSel)return;
  const cid=cSel?cSel.value:'';
  const list=S.destinazioni.filter(x=>!cid||!x.clienteId||x.clienteId===cid);
  dSel.innerHTML=`<option value="">— tutte —</option>`+list.map(x=>`<option value="${x.id}" ${x.id===selId?'selected':''}>${esc([x.indirizzo,x.citta].filter(Boolean).join(', '))}</option>`).join('');
}

let modalSubmit=null;
function openModal(title,bodyHtml,onSubmit,{wide=false,submitLabel='Salva'}={}){
  modalSubmit=onSubmit;
  const m=document.getElementById('modal');
  m.className='modal'+(wide?' wide':'');m.style.maxWidth='';
  m.innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2>
    <button class="icon-btn sm" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Annulla</button>
    <button class="btn primary" onclick="submitModal()">${submitLabel}</button></div>`;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');modalSubmit=null;}
function submitModal(){if(modalSubmit){const r=modalSubmit();if(r!==false)closeModal();}else closeModal();}
document.getElementById('overlay').addEventListener('mousedown',e=>{if(e.target.id==='overlay')closeModal();});

/* ---- Tendine con ricerca ----
   Ogni <select> con più di SELPOP_MIN voci apre un elenco filtrabile invece del menu nativo. */
const SELPOP_MIN=8;
let selpopTarget=null;
function selpopClose(){
  const p=document.getElementById('selpop');if(p)p.remove();
  selpopTarget=null;
}
function selpopOptions(sel){
  return [...sel.options].map((o,i)=>({i,label:o.textContent,disabled:o.disabled,selected:o.selected}));
}
function selpopRender(filtro){
  const box=document.getElementById('selpop-list');if(!box||!selpopTarget)return;
  const t=(filtro||'').toLowerCase().trim();
  const opts=selpopOptions(selpopTarget).filter(o=>!t||o.label.toLowerCase().includes(t));
  box.innerHTML=opts.length?opts.map(o=>`<button type="button" class="selpop-it ${o.selected?'sel':''}" data-i="${o.i}" ${o.disabled?'disabled':''}>${esc(o.label)}</button>`).join('')
    :`<div class="sub" style="padding:10px 12px">Nessuna corrispondenza.</div>`;
}
function selpopPick(i){
  const sel=selpopTarget;if(!sel)return;
  sel.selectedIndex=parseInt(i);
  selpopClose();
  sel.dispatchEvent(new Event('change',{bubbles:true}));
}
function selpopOpen(sel){
  selpopClose();selpopTarget=sel;
  const r=sel.getBoundingClientRect();
  const w=Math.min(Math.max(r.width,240),440);
  const sotto=window.innerHeight-r.bottom>240;
  const p=document.createElement('div');p.id='selpop';p.className='selpop';
  p.style.width=w+'px';p.style.left=Math.min(r.left,window.innerWidth-w-8)+'px';
  if(sotto)p.style.top=(r.bottom+4)+'px';else p.style.bottom=(window.innerHeight-r.top+4)+'px';
  p.innerHTML=`<div class="selpop-head">${svg(IC.search,2)}<input id="selpop-q" placeholder="Cerca…" autocomplete="off"></div>
    <div class="selpop-list" id="selpop-list"></div>`;
  document.body.appendChild(p);
  selpopRender('');
  const q=document.getElementById('selpop-q');
  q.addEventListener('input',()=>selpopRender(q.value));
  q.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();selpopClose();sel.focus();}
    if(e.key==='Enter'){e.preventDefault();const first=p.querySelector('.selpop-it:not([disabled])');if(first)selpopPick(first.dataset.i);}
  });
  p.addEventListener('mousedown',e=>{const b=e.target.closest('.selpop-it');if(b&&!b.disabled){e.preventDefault();selpopPick(b.dataset.i);}});
  setTimeout(()=>q.focus(),0);
}
document.addEventListener('mousedown',e=>{
  const p=document.getElementById('selpop');
  if(p&&!p.contains(e.target)&&e.target!==selpopTarget){selpopClose();}
  const sel=e.target.closest('select');
  if(!sel||sel.disabled||sel.multiple)return;
  if(sel.options.length<SELPOP_MIN)return;
  if(sel.closest('#doc-preview'))return;
  e.preventDefault();sel.blur();selpopOpen(sel);
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')selpopClose();});
window.addEventListener('resize',selpopClose);

function qaInput(f,val){
  const v=val!=null?val:(f.def!=null?f.def:'');
  const oc=f.onchange?` onchange="${f.onchange}"`:'';
  const objOptions=f.optionsFn?f.optionsFn():f.objOptions;
  if(f.type==='select'&&objOptions)return `<select data-qk="${f.k}"${oc}>${objOptions.map(o=>`<option value="${o.value}" ${o.value===v?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
  if(f.type==='um')return `<select data-qk="${f.k}"${oc}>${umOptionsHtml(v)}</select>`;
  if(f.type==='cliente')return `<select data-qk="${f.k}"${oc}><option value="">— nessuno —</option>${S.clienti.map(c=>`<option value="${c.id}" ${c.id===v?'selected':''}>${esc(c.ragioneSociale)}</option>`).join('')}</select>`;
  if(f.type==='listino')return `<select data-qk="${f.k}"${oc}><option value="">— nessuno —</option>${S.listini.map(l=>`<option value="${l.id}" ${l.id===v?'selected':''}>${esc(l.nome)}</option>`).join('')}</select>`;
  const t=f.type==='number'?'number':(f.type==='date'?'date':'text');const step=f.type==='number'?' step="any"':'';
  return `<input type="${t}"${step} data-qk="${f.k}" value="${esc(v)}">`;
}
function qaToggle(){
  const vals={};document.querySelectorAll('#modal2 [data-qk]').forEach(el=>{vals[el.dataset.qk]=el.value;});
  document.querySelectorAll('#modal2 [data-showif]').forEach(w=>{
    let cond;try{cond=JSON.parse(w.dataset.showif);}catch(e){return;}
    let vis;if('canone' in cond)vis=(contrattoIsCanoneById(vals[cond.k])===cond.canone);else if('r10' in cond)vis=(contrattoIsR10ById(vals[cond.k])===cond.r10);else if('pagabile' in cond)vis=(contrattoPagabileById(vals[cond.k])===cond.pagabile);else vis=(cond.in||[]).includes(vals[cond.k]);
    w.style.display=vis?'':'none';
  });
}
/* Apre la creazione rapida; onCreated(record) riceve il nuovo elemento */
function quickAdd(kind,prefill,onCreated){
  const cfg=QUICKADD[kind];if(!cfg){toast('Creazione non disponibile');return;}
  prefill=prefill||{};
  const body=`<div class="form-grid">${cfg.fields.map(f=>`
    <div class="field ${f.col2?'col2':''}" ${f.showIf?`data-showif="${esc(JSON.stringify(f.showIf))}"`:''}><label>${f.label}${f.req?' <span class="req">*</span>':''}</label>
    ${qaInput(f,prefill[f.k])}</div>`).join('')}</div>`;
  openModal2(`Nuovo ${cfg.singular}`,body,()=>{
    const rec={id:uid()};
    document.querySelectorAll('#modal2 [data-qk]').forEach(el=>{let val=el.value;if(el.type==='number')val=val===''?'':num(val);rec[el.dataset.qk]=val;});
    if(prefill.__force)Object.assign(rec,prefill.__force);
    for(const f of cfg.fields){
      if(f.showIf){const hid=('canone' in f.showIf)?(contrattoIsCanoneById(rec[f.showIf.k])!==f.showIf.canone):('r10' in f.showIf)?(contrattoIsR10ById(rec[f.showIf.k])!==f.showIf.r10):('pagabile' in f.showIf)?(contrattoPagabileById(rec[f.showIf.k])!==f.showIf.pagabile):!(f.showIf.in||[]).includes(rec[f.showIf.k]);if(hid)continue;}
      if(f.req&&!String(rec[f.k]||'').trim()){toast('Compila: '+f.label);return false;}
    }
    if(cfg.prepare&&cfg.prepare(rec)===false)return false;
    cfg.arr().push(rec);
    if(cfg.after)cfg.after(rec);
    persist();
    if(onCreated)onCreated(rec);
    toast(cfg.singular.charAt(0).toUpperCase()+cfg.singular.slice(1)+' creato');
    return true;
  },{wide:!!cfg.wide||kind==='clienti'||kind==='mezzi'||kind==='materiali'});
  qaToggle();
}

function selAddOption(selEl,value,label,{prepend=false}={}){
  if(!selEl)return;const o=document.createElement('option');o.value=value;o.textContent=label;
  if(prepend&&selEl.firstChild)selEl.insertBefore(o,selEl.firstChild.nextSibling);else selEl.appendChild(o);
  selEl.value=value;

/* Crea una voce e la seleziona nel <select> con id dato */
function quickAddInto(kind,selectId,prefill,after){
  quickAdd(kind,prefill,rec=>{
    const cfg=QUICKADD[kind];const val=(cfg.value?cfg.value(rec):rec.id);const lab=cfg.label(rec);
    const s=document.getElementById(selectId);
    selAddOption(s,val,lab);
    // rende la nuova voce subito disponibile in ogni altro menu della stessa anagrafica aperto nel form
    document.querySelectorAll('select[data-ent="'+kind+'"]').forEach(o=>{
      if(o!==s && !Array.from(o.options).some(op=>op.value===String(val))){

    const doc=S.ddt.find(x=>x.id===id);

function ddtUmOptions(materialeId,ctx,sel){

/* Esiste un prezzo esplicito per quel materiale con quella U.M.? */
function prezzoUMEsiste(materialeId,um,ctx){
  ctx=ctx||{};const c=ctx.contrattoId||'';const ls=[];
  if(ctx.clienteId){const lc=S.listini.find(l=>l.tipo==='cliente'&&l.clienteId===ctx.clienteId&&!l.destinazioneId);if(lc)ls.push(lc);}
  const r=resolveListino(ctx);if(r&&ls.indexOf(r)<0)ls.push(r);
  return ls.some(l=>(l.voci||[]).some(v=>v.materialeId===materialeId&&(v.um||'')===(um||'')&&((c&&(v.contrattoId||'')===c)||!v.contrattoId)));
}
function addMaterialeToClienteListino(clienteId,materialeId,prezzo){
  if(!clienteId||!materialeId||!(num(prezzo)>0))return false;
  const c=clienteById(clienteId);if(!c||c.isAzienda)return false; // per la Cava basta il listino base
  let l=S.listini.find(x=>x.tipo==='cliente'&&x.clienteId===clienteId&&!x.destinazioneId);
  let creato=false;
  if(!l){l={id:uid(),nome:'Listino '+clienteName(clienteId),tipo:'cliente',clienteId,destinazioneId:'',voci:[]};S.listini.push(l);creato=true;}
  l.voci=l.voci||[];
  const v=l.voci.find(v=>v.materialeId===materialeId);
  if(v)v.prezzo=num(prezzo);else l.voci.push({materialeId,prezzo:num(prezzo)});
  return creato;
}
function addMaterialeToClienteListinoUM(clienteId,materialeId,um,prezzo){
  if(!clienteId||!materialeId||!(num(prezzo)>0))return false;
  const c=clienteById(clienteId);if(!c||c.isAzienda)return false;
  let l=S.listini.find(x=>x.tipo==='cliente'&&x.clienteId===clienteId&&!x.destinazioneId);
  if(!l){l={id:uid(),nome:'Listino '+clienteName(clienteId),tipo:'cliente',clienteId,destinazioneId:'',voci:[]};S.listini.push(l);}
  l.voci=l.voci||[];
  const v=l.voci.find(v=>v.materialeId===materialeId&&(v.um||'')===(um||''));
  if(v)v.prezzo=num(prezzo);else l.voci.push({materialeId,um:um||'',prezzo:num(prezzo)});

    const um=tr.querySelector('.l-um').value;
    if(!um&&!tr.querySelector('.l-mat').value)return;   // riga vuota: ignorata
    righe++;
    const q=num(tr.querySelector('.l-qta').value);
    const f=kgFactor(um);
    if(f>0){aPeso++;netto+=q*f;}
  });
  // lordo automatico solo se TUTTE le righe compilate sono a peso (kg/quintali/tonnellate)
  const autoPeso = righe>0 && aPeso===righe;
  const tara=num(document.getElementById('d-tara').value);
  const lordoEl=document.getElementById('d-lordo'),nettoEl=document.getElementById('d-netto');
  const hint=document.getElementById('d-lordo-hint');
  if(autoPeso){
    lordoEl.readOnly=true;
    nettoEl.value=round2(netto);
    lordoEl.value=round2(netto+tara);
    if(hint){hint.textContent='(automatico dalla quantità)';hint.style.color='';}
  }else{
    lordoEl.readOnly=false;
    const lordo=num(lordoEl.value);
    nettoEl.value=round2(Math.max(0,lordo-tara));
    if(hint){
      if(lordo>0&&lordo<tara){hint.textContent='⚠ Il lordo non può essere inferiore alla tara';hint.style.color='var(--danger)';}
      else{hint.textContent=righe>aPeso&&aPeso>0?'(inseriscilo a mano: unità miste)':'(inseriscilo a mano: unità non a peso)';hint.style.color='';}
    }
  }
  ddtTrasportoAuto();
}

function ddtComputeResa(){

  return (tipo&&prezzo>0)?'FRANCO DESTINO':'FRANCO CAVA';
}
function ddtUpdateResa(){
  const el=document.getElementById('d-resa');if(!el||el.dataset.touched)return;
  el.value=ddtComputeResa();
}
function ddtTrasportoUM(sel){sel.dataset.touched='1';ddtTrasportoAuto();}
/* Righe compilate con quantità (per proporre U.M. e quantità del trasporto) */
function ddtRigheConQta(){
  return [...document.querySelectorAll('#ddt-lines-body tr')].map(tr=>({
    mat:tr.querySelector('.l-mat').value,
    desc:tr.querySelector('.l-desc').value.trim(),
    um:tr.querySelector('.l-um').value,
    qta:num(tr.querySelector('.l-qta').value)
  })).filter(r=>(r.mat||r.desc)&&r.qta>0);
}
function ddtTrasportoAuto(force){
  const tipoEl=document.getElementById('d-tr-tipo');if(!tipoEl)return;
  const q=document.getElementById('d-tr-qta'),hint=document.getElementById('d-tr-hint');
  const umEl=document.getElementById('d-tr-um');
  if(!q||!umEl)return;
  if(tipoEl.value!=='misura'){if(hint)hint.textContent='';return;}
  if(force){q.dataset.touched='';umEl.dataset.touched='';}
  const righe=ddtRigheConQta();
  // un solo materiale: propongo la sua unità di misura e la sua quantità
  if(righe.length===1){
    const r=righe[0];
    if(!umEl.dataset.touched&&r.um){
      if(![...umEl.options].some(o=>o.value===r.um)){const o=document.createElement('option');o.value=r.um;o.textContent=r.um;umEl.appendChild(o);}
      umEl.value=r.um;
    }
    if(!q.dataset.touched)q.value=r.qta;
    if(hint){
      const auto=`${qty(r.qta)} ${r.um||''}`.trim();
      hint.textContent=(q.dataset.touched||umEl.dataset.touched)
        ? `Modificato a mano — dal materiale: ${auto}`
        : `Da: ${r.desc||'materiale'} (${auto}) — puoi modificarlo`;
    }
    return;
  }
  // più materiali (o nessuno): U.M. e quantità a scelta, con aiuto dal peso netto se l'unità è a peso
  const um=umEl.value;
  const f=kgFactor(um);
  if(f<=0){if(hint)hint.textContent=righe.length>1?'Più materiali: indica U.M. e quantità del trasporto.':'Unità non a peso: inserisci la quantità.';return;}
  const netto=num(document.getElementById('d-netto').value);
  const val=netto?round2(netto/f):'';
  if(!q.dataset.touched)q.value=val;
  if(hint)hint.textContent=q.dataset.touched
    ? `Valore inserito a mano — peso netto: ${val?qty(val):'—'} ${um}`
    : `Più materiali: compilato con il peso netto (${val?qty(val):'—'} ${um}) — puoi modificarlo`;
}

function mezziBeforeSave(d){
  const scelta=d.proprietaScelta;
  if(!scelta){toast('Indica la proprietà del mezzo');return false;}
  if(scelta==='__new__'){
    if(!String(d.noRag||'').trim()){toast('Inserisci la ragione sociale della nuova società');return false;}
    const cli={id:uid(),ragioneSociale:d.noRag.trim(),partitaIva:d.noPiva||'',codiceFiscale:d.noCf||'',indirizzo:d.noInd||'',cap:d.noCap||'',citta:d.noCitta||'',provincia:d.noProv||''};
    S.clienti.push(cli);d.clienteId=cli.id;
  }else d.clienteId=scelta;
  const c=clienteById(d.clienteId);
  d.proprieta=(c&&c.isAzienda)?'cava':'cliente';
  ['proprietaScelta','noRag','noPiva','noCf','noInd','noCap','noCitta','noProv','dittaNome','dittaSede','dittaPiva','dittaCf'].forEach(k=>delete d[k]);
  return true;
}
function committenteIsCava(clienteId){
  const c=clienteById(clienteId);if(!c)return false;
  if(c.isAzienda)return true;
  return !!(S.azienda&&S.azienda.partitaIva&&c.partitaIva===S.azienda.partitaIva);
}
function computeTAC(m){
  const committente=(document.getElementById('d-cliente')||{}).value;
  let tac='';
  if(m){
    const ownerId=m.clienteId||null;
    const ownerC=ownerId?clienteById(ownerId):null;
    const ownerIsCava=ownerC?!!ownerC.isAzienda:(m.proprieta==='cava'||!m.dittaNome);
    const cavaComm=committenteIsCava(committente);
    let ownerEqComm;
    if(ownerIsCava) ownerEqComm=cavaComm;
    else ownerEqComm=!!(ownerId&&ownerId===committente);
    if(ownerEqComm) tac=(ownerIsCava&&cavaComm)?'cedente':'cessionario';
    else tac='vettore';
  }
  const sel=document.getElementById('d-tac-sel');if(!sel)return;
  sel.dataset.auto=tac||'cedente';
  if(!sel.dataset.touched){sel.value=tac||'cedente';}

  if(sel.dataset.touched){h.innerHTML='Impostato a mano · <a href="#" onclick="ddtTacAuto();return false" style="color:var(--accent)">usa automatico</a>';}
